name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go version
        run: go version

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        run: go test -count=1 ./...

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        # sdk/plugin/cabi and examples/plugin require cgo; the Windows job
        # covers the rest without requiring a MinGW toolchain.
        run: go test -count=1 ./sdk ./sdk/plugin ./sdk/internal/... ./examples/sdk ./examples/plugin-protocol ./examples/plugin-subagent

      - name: Run vet (Linux)
        if: runner.os != 'Windows'
        run: go vet ./...

      - name: Run vet (Windows)
        if: runner.os == 'Windows'
        run: go vet ./sdk ./sdk/plugin ./sdk/internal/... ./examples/sdk ./examples/plugin-protocol ./examples/plugin-subagent

  plugin-integration:
    name: Plugin integration (cgo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check C toolchain
        run: gcc --version

      - name: Run plugin integration tests
        run: go test -count=1 -tags plugin_integration ./sdk -run 'Test(Native|Protocol)Plugin' -v
