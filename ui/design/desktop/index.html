<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="nulo desktop — an interactive design prototype for the nulo coding agent.">
<title>nulo — desktop shell</title>
<script>
  try {
    var p = JSON.parse(localStorage.getItem("nulo.desktop.prototype.v1") || "{}");
    var r = document.documentElement;
    r.dataset.theme = p.theme === "paper" ? "paper" : "moss";
    if (p.density) r.dataset.density = p.density;
    if (p.motion) r.dataset.motion = p.motion;
    if (typeof p.timestamps === "boolean") r.dataset.timestamps = p.timestamps ? "on" : "off";
    if (typeof p.reasoning === "boolean") r.dataset.reasoning = p.reasoning ? "on" : "off";
  } catch (error) {}
</script>

<div class="app" id="app" data-theme="moss" data-density="comfortable">
  <header class="titlebar">
    <div class="titlebar-brand" title="nulo desktop">
      <span class="logo-mark" aria-hidden="true">n</span>
      <span class="brand-name">nulo</span>
    </div>

    <div class="workspace-chip" title="Workspace">
      <span class="workspace-icon" aria-hidden="true">n</span>
      <span class="workspace-name">nulo</span>
      <span class="workspace-branch"><span class="branch-dot"></span>main</span>
    </div>

    <button class="command-trigger" id="commandTrigger" aria-label="Search sessions and commands">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="command-trigger-label">Search sessions and commands</span>
      <kbd>Ctrl K</kbd>
    </button>

    <div class="titlebar-actions">
      <button class="run-badge" id="runBadge" title="Show active sessions">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span id="runBadgeLabel">2 active</span>
      </button>
      <div class="titlebar-divider" aria-hidden="true"></div>
      <button class="icon-btn" id="toggleSidebarBtn" aria-label="Toggle sidebar" title="Toggle sidebar · Ctrl B">
        <svg class="icon" aria-hidden="true"><use href="#i-panel-left"/></svg>
      </button>
      <button class="icon-btn is-on" id="toggleDockBtn" aria-label="Toggle right panel" title="Toggle right panel · Ctrl J">
        <svg class="icon" aria-hidden="true"><use href="#i-panel-right"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings · Ctrl ,">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
      </button>
    </div>
  </header>

  <div class="workbench" id="workbench">
    <aside class="sidebar" id="sidebar" aria-label="Sessions">
      <div class="sidebar-top">
        <button class="new-session-btn" id="newSessionBtn">
          <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          <span>New session</span>
          <kbd>Ctrl N</kbd>
        </button>

        <label class="sidebar-search" for="sessionSearch">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="sessionSearch" type="search" placeholder="Filter sessions" autocomplete="off" spellcheck="false">
          <kbd>Ctrl F</kbd>
        </label>

        <div class="filter-row" id="filterRow" role="tablist" aria-label="Filter sessions"></div>
      </div>

      <div class="sidebar-scroll" id="projectList"></div>

      <div class="sidebar-footer">
        <button class="sidebar-link" id="capabilitiesBtn">
          <svg class="icon" aria-hidden="true"><use href="#i-plug"/></svg>
          <span>Capabilities</span>
          <span class="count-badge">3</span>
        </button>
        <button class="sidebar-link" id="sidebarSettingsBtn">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
          <span>Settings</span>
          <kbd>Ctrl ,</kbd>
        </button>
        <button class="account-row" id="accountRow" title="Local runtime">
          <span class="account-avatar">C</span>
          <span class="account-copy">
            <strong>crazy</strong>
            <small>local · cgo</small>
          </span>
          <span class="account-status" aria-label="Connected"></span>
        </button>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="sessionbar" id="sessionbar"></header>

      <div class="conversation-scroll" id="conversationScroll">
        <div class="conversation" id="conversation" tabindex="0" aria-label="Conversation"></div>
      </div>

      <div class="composer-dock" id="composerDock">
        <div class="composer-wrap">
          <div class="composer" id="composer">
            <div class="slash-menu" id="slashMenu" hidden></div>
            <div class="slash-menu mention-menu" id="mentionMenu" hidden></div>
            <div class="attachment-tray" id="attachmentTray" hidden></div>

            <textarea id="composerInput" rows="1" placeholder="Ask nulo to build, debug, or explain…" aria-label="Message nulo"></textarea>
            <input id="fileInput" type="file" multiple hidden>

            <div class="composer-toolbar">
              <div class="toolbar-left">
                <button class="icon-btn soft" id="attachBtn" aria-label="Attach files" title="Attach files">
                  <svg class="icon" aria-hidden="true"><use href="#i-paperclip"/></svg>
                </button>

                <div class="popover-anchor">
                  <button class="chip" id="approvalChip" aria-haspopup="menu" aria-expanded="false" title="Permission mode">
                    <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
                    <span class="chip-label">Auto edits</span>
                    <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
                  </button>
                  <div class="popover permission-popover" id="approvalPopover" hidden></div>
                </div>

                <div class="popover-anchor">
                  <button class="chip" id="envChip" aria-haspopup="menu" aria-expanded="false" title="Environment">
                    <svg class="icon" aria-hidden="true"><use href="#i-git-branch"/></svg>
                    <span class="chip-label">Local · main</span>
                    <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
                  </button>
                  <div class="popover env-popover" id="envPopover" hidden></div>
                </div>
              </div>

              <div class="toolbar-right">
                <button class="ctx-pill" id="ctxPill" title="Open context panel">
                  <span class="ctx-ring" id="ctxRing" aria-hidden="true"></span>
                  <span id="ctxPillLabel">42.8k / 512k</span>
                </button>

                <div class="popover-anchor">
                  <button class="chip model-chip" id="modelChip" aria-haspopup="menu" aria-expanded="false" title="Switch model">
                    <svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg>
                    <span class="chip-label" id="modelChipLabel">DeepSeek V4.1 Flash</span>
                    <svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
                  </button>
                  <div class="popover model-popover" id="modelPopover" hidden></div>
                </div>

                <button class="send-btn" id="sendBtn" aria-label="Send message" title="Send · Enter">
                  <svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg>
                </button>
              </div>
            </div>

            <div class="composer-meta" id="composerMeta"></div>
          </div>
        </div>
      </div>
    </main>

    <aside class="dock" id="dock" aria-label="Session details">
      <div class="dock-resizer" id="dockResizer" title="Drag to resize"></div>
      <div class="dock-inner">
        <header class="dock-header" id="dockHeader"></header>
        <div class="dock-body" id="dockBody"></div>
      </div>
    </aside>
  </div>
</div>

<div class="overlay palette-overlay" id="paletteOverlay" hidden>
  <section class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <header class="palette-search">
      <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="paletteInput" type="text" placeholder="Search sessions, actions, and settings…" aria-label="Search sessions, actions, and settings" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </header>
    <div class="palette-list" id="paletteList"></div>
    <footer class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> select</span>
      <span class="palette-foot-right">nulo 0.8</span>
    </footer>
  </section>
</div>

<div class="overlay settings-overlay" id="settingsOverlay" hidden>
  <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <header class="settings-head">
      <div>
        <p class="eyebrow">nulo desktop</p>
        <h2 id="settingsTitle">Settings</h2>
      </div>
      <button class="icon-btn" id="settingsClose" aria-label="Close settings">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </header>
    <div class="settings-layout">
      <nav class="settings-nav" id="settingsNav" aria-label="Settings sections"></nav>
      <div class="settings-content" id="settingsContent"></div>
    </div>
    <footer class="settings-foot">
      <span id="settingsFootNote">Preferences apply immediately in this prototype.</span>
      <button class="btn primary" id="settingsDone">Done</button>
    </footer>
  </section>
</div>

<div class="overlay dialog-overlay" id="dialogOverlay" hidden>
  <section class="mini-dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <header class="mini-dialog-head">
      <div>
        <p class="eyebrow" id="dialogEyebrow">Session</p>
        <h2 id="dialogTitle">Rename session</h2>
      </div>
      <button class="icon-btn" id="dialogClose" aria-label="Close dialog">
        <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </header>
    <p class="mini-dialog-desc" id="dialogDesc"></p>
    <label class="mini-dialog-field" id="dialogField">
      <span>Session name</span>
      <input id="dialogInput" type="text" autocomplete="off">
    </label>
    <footer class="mini-dialog-actions">
      <button class="btn ghost" type="button" id="dialogCancel">Cancel</button>
      <button class="btn primary" type="button" id="dialogConfirm">Save</button>
    </footer>
  </section>
</div>

<div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

<noscript>
  <div class="noscript">nulo desktop is an interactive prototype. Enable JavaScript to use it.</div>
</noscript>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
