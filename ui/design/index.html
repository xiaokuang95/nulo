<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>nulo — command palette build</title>
<style>
  :root {
    --bg: #080a09;
    --surface: #0a0d0b;
    --surface-2: #0d110e;
    --surface-3: #111611;
    --ink: #e6eae1;
    --ink-soft: #c3cab9;
    --muted: #828b7d;
    --faint: #566052;
    --line: #1b211c;
    --line-strong: #2b332c;
    --accent: #b7e08b;
    --accent-bright: #cbf4a5;
    --accent-dim: #7da35e;
    --accent-wash: rgba(183, 224, 139, .075);
    --accent-line: rgba(183, 224, 139, .29);
    --shadow: rgba(0, 0, 0, .68);
    --mono: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Monaco, "Cascadia Mono", "Sarasa Mono SC", "Noto Sans Mono CJK SC", monospace;
    --rail-w: 352px;
    --topbar-min: 52px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(85% 58% at 22% -18%, rgba(183, 224, 139, .045), transparent 62%),
      linear-gradient(180deg, #090b09 0%, #070908 68%, #080a09 100%);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  ::selection { color: #0b1008; background: var(--accent); }
  button, input, textarea { font: inherit; color: inherit; }
  button { border: 0; background: none; cursor: pointer; padding: 0; }
  button:disabled { cursor: default; }
  button, a, textarea, input { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }
  code, kbd, pre { font-family: var(--mono); }
  kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 15px;
    padding: 0 3px;
    border: 1px solid var(--line-strong);
    color: var(--faint);
    font-size: 8px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: .02em;
  }
  [hidden] { display: none !important; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #293029; border: 1px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a4539; }
  * { scrollbar-width: thin; scrollbar-color: #293029 transparent; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    position: relative;
  }

  /* ── chrome ─────────────────────────────────────────────────────────── */
  .topbar {
    flex: 0 0 auto;
    min-height: var(--topbar-min);
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(8, 10, 9, .9);
    backdrop-filter: blur(12px);
    position: relative;
    z-index: 30;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 0 0 auto;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    user-select: none;
  }
  .brand-mark {
    width: 15px;
    height: 15px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 2px;
    transform: rotate(0.01deg);
  }
  .brand-mark i { display: block; background: var(--accent); }
  .brand-mark i:nth-child(2),
  .brand-mark i:nth-child(3) {
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--accent-dim);
  }
  .brand-word {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -.06em;
    color: var(--ink);
  }
  .brand-sub {
    margin-left: 1px;
    padding-left: 9px;
    border-left: 1px solid var(--line-strong);
    color: var(--faint);
    font-size: 8px;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .top-divider {
    width: 1px;
    height: 17px;
    background: var(--line);
    flex: 0 0 auto;
  }
  .session {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .session-prefix { color: var(--accent-dim); }
  .session-name {
    max-width: 172px;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .01em;
  }

  .meta-strip {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 22px;
    margin-left: auto;
    min-width: 0;
  }
  .meta-item {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
    white-space: nowrap;
  }
  .meta-label {
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .16em;
  }
  .meta-value {
    color: var(--ink-soft);
    font-size: 10px;
    letter-spacing: .01em;
  }
  .meta-item.cwd .meta-value { color: var(--muted); }
  .meta-item.branch .meta-value { color: var(--faint); }

  .context {
    width: 112px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .context-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 7px;
    font-size: 7.5px;
    letter-spacing: .12em;
    color: var(--faint);
    white-space: nowrap;
  }
  .context-head b { color: var(--ink-soft); font-weight: 500; letter-spacing: .01em; }
  .context-track {
    height: 3px;
    background: #1b211b;
    overflow: hidden;
    position: relative;
  }
  .context-fill {
    display: block;
    height: 100%;
    width: 32.6%;
    background:
      repeating-linear-gradient(90deg, transparent 0 8px, rgba(8, 10, 9, .85) 8px 9px),
      var(--accent);
    transition: width .5s var(--ease);
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-left: 2px;
    flex: 0 0 auto;
  }
  .run-status {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 92px;
    padding: 0 1px;
  }
  .status-light {
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(183, 224, 139, .07);
  }
  .run-status[data-state="running"] .status-light { animation: breathe 1.6s ease-in-out infinite; }
  .run-status[data-state="awaiting"] .status-light {
    background: transparent;
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 3px rgba(183, 224, 139, .06);
    animation: breathe 2.2s ease-in-out infinite;
  }
  .run-status[data-state="blocked"] .status-light {
    background: transparent;
    border: 1px solid var(--muted);
    box-shadow: none;
  }
  .run-status[data-state="complete"] .status-light { border-radius: 1px; }
  .run-status[data-state="idle"] .status-light { background: var(--faint); box-shadow: none; }
  .status-copy { display: flex; flex-direction: column; gap: 1px; line-height: 1.08; }
  .status-label {
    color: var(--ink-soft);
    font-size: 8px;
    font-weight: 500;
    letter-spacing: .13em;
    white-space: nowrap;
  }
  .run-status[data-state="awaiting"] .status-label { color: var(--accent); }
  .run-status[data-state="blocked"] .status-label { color: var(--ink); }
  .status-detail {
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .02em;
    white-space: nowrap;
  }

  .key-button {
    height: 27px;
    min-width: 31px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0 7px;
    border: 1px solid var(--line-strong);
    color: var(--muted);
    font-size: 9px;
    letter-spacing: .02em;
    transition: color .16s, border-color .16s, background .16s;
  }
  .key-button:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-wash); }
  .key-button .key-symbol { color: var(--faint); font-size: 8px; }
  .drawer-btn { display: none; gap: 6px; padding: 0 8px; }
  .drawer-btn b { color: var(--ink-soft); font-weight: 400; font-size: 8px; }

  /* ── layout ─────────────────────────────────────────────────────────── */
  .shell {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w);
  }
  .workspace {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .feed {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    scrollbar-gutter: stable;
  }
  .feed-inner {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 15px 34px 24px;
  }

  /* ── transcript ─────────────────────────────────────────────────────── */
  .system-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 0 13px;
    color: var(--faint);
    font-size: 9px;
    line-height: 1.4;
    letter-spacing: .025em;
    white-space: nowrap;
    overflow: hidden;
  }
  .system-row .sig { color: var(--accent-dim); font-size: 11px; }
  .system-row .sys-sep { color: #303830; }
  .system-row .sys-right { margin-left: auto; color: #424d40; font-size: 8px; letter-spacing: .1em; }
  .system-row .sys-strong { color: var(--muted); }

  .turn {
    position: relative;
    padding: 15px 0 16px 26px;
    animation: turnIn .28s var(--ease) both;
  }
  .turn + .turn { border-top: 1px solid var(--line); }
  .turn-user { padding-top: 18px; padding-bottom: 17px; }
  .turn-head {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 14px;
    color: var(--faint);
    font-size: 8px;
    line-height: 1.1;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .speaker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: .14em;
  }
  .speaker-mark {
    color: var(--accent);
    font-size: 12px;
    line-height: .8;
    font-weight: 400;
    letter-spacing: 0;
  }
  .agent-sigil {
    width: 6px;
    height: 6px;
    background: var(--accent);
    display: inline-block;
    box-shadow: 0 0 0 2px rgba(183, 224, 139, .08);
  }
  .turn-time { color: var(--faint); letter-spacing: .02em; font-size: 8px; }
  .turn-route {
    margin-left: auto;
    color: #414b3f;
    font-size: 7.5px;
    letter-spacing: .08em;
  }
  .user-copy {
    margin: 7px 0 0;
    max-width: 800px;
    color: var(--ink);
    font-size: 13.5px;
    line-height: 1.65;
    letter-spacing: .003em;
    overflow-wrap: anywhere;
  }
  .user-copy code,
  .agent-copy code {
    color: var(--accent-bright);
    background: rgba(183, 224, 139, .045);
    border: 1px solid rgba(183, 224, 139, .11);
    padding: 0 3px;
    font-size: .92em;
    white-space: nowrap;
  }
  .agent-copy {
    margin: 9px 0 0;
    max-width: 790px;
    min-height: 1.55em;
    color: var(--ink-soft);
    font-size: 12.5px;
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  .agent-copy .cursor { margin-left: 2px; }
  .agent-followup {
    margin: 12px 0 0;
    padding-left: 10px;
    border-left: 1px solid var(--line-strong);
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.6;
  }
  .cursor {
    display: inline-block;
    width: 6px;
    height: 13px;
    margin-left: 1px;
    vertical-align: -2px;
    background: var(--accent);
    animation: blink 1.05s steps(1, end) infinite;
  }

  .reasoning-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    margin: 9px 0 0;
    padding: 1px 0;
    color: var(--faint);
    font-size: 8.5px;
    letter-spacing: .11em;
    text-align: left;
    user-select: none;
  }
  .reasoning-toggle:hover .reasoning-label { color: var(--accent); }
  .reasoning-chevron {
    width: 9px;
    color: var(--faint);
    font-size: 8px;
    transition: transform .18s var(--ease);
  }
  .reasoning-toggle[aria-expanded="true"] .reasoning-chevron { transform: rotate(90deg); }
  .reasoning-label { color: var(--muted); font-size: 8px; font-weight: 600; letter-spacing: .14em; transition: color .16s; }
  .reasoning-time { color: #465142; letter-spacing: .025em; font-size: 8px; }
  .reasoning-rule { height: 1px; flex: 1; background: var(--line); margin-left: 3px; }
  .thinking-label { display: inline-flex; align-items: center; gap: 6px; color: var(--faint); }
  .thinking-dot {
    width: 5px; height: 5px; border: 1px solid var(--accent-dim); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .9s linear infinite;
  }
  .reasoning-body {
    margin: 4px 0 2px 16px;
    padding: 3px 0 4px 13px;
    border-left: 1px solid var(--line-strong);
    animation: reveal .2s var(--ease) both;
  }
  .reasoning-step {
    display: grid;
    grid-template-columns: 20px minmax(0, 1fr);
    gap: 7px;
    padding: 2px 0;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.55;
  }
  .reasoning-step > span { color: #495445; font-size: 8px; padding-top: 2px; }

  /* ── tool activity ──────────────────────────────────────────────────── */
  .tool-section {
    margin-top: 12px;
    padding: 7px 0 7px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .tool-section + .tool-section { margin-top: 8px; }
  .tool-section-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-bottom: 4px;
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .13em;
    line-height: 1.3;
  }
  .tool-pulse {
    width: 4px; height: 4px; background: var(--accent-dim); border-radius: 50%;
    box-shadow: 0 0 6px rgba(183, 224, 139, .35);
  }
  .tool-count { margin-left: auto; color: #404a3e; font-size: 7.5px; letter-spacing: .04em; }
  .tool-list { display: flex; flex-direction: column; }
  .tool-row {
    display: grid;
    grid-template-columns: 50px minmax(0, 1fr) auto 34px;
    align-items: center;
    gap: 10px;
    min-height: 21px;
    font-size: 10.5px;
    line-height: 1.3;
  }
  .tool-row.is-running { color: var(--muted); }
  .tool-kind {
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .tool-row.is-running .tool-kind { color: var(--accent-dim); }
  .tool-cmd {
    min-width: 0;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -.005em;
  }
  .tool-state {
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    min-width: 15px;
    color: var(--accent);
    font-size: 8px;
    letter-spacing: .03em;
  }
  .tool-row.is-failed .tool-state { color: var(--ink); }
  .tool-row.is-review .tool-state { color: var(--accent); letter-spacing: .08em; }
  .tool-time {
    color: #485244;
    font-size: 8px;
    text-align: right;
    white-space: nowrap;
  }
  .tool-spinner {
    width: 7px; height: 7px; border: 1px solid var(--line-strong);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .75s linear infinite;
  }
  .tool-detail {
    margin: 0 0 2px 50px;
    padding-left: 9px;
    border-left: 1px solid var(--line-strong);
    color: #657060;
    font-size: 9px;
    line-height: 1.55;
    letter-spacing: .01em;
  }
  .tool-detail .tree { color: #3c473a; margin-right: 5px; }

  /* ── diff ───────────────────────────────────────────────────────────── */
  .patch-wrap { margin-top: 13px; }
  .diff-panel {
    border: 1px solid var(--line-strong);
    background: #090c0a;
    transition: border-color .2s, opacity .2s;
  }
  .diff-panel[data-state="applied"] { border-color: var(--accent-line); }
  .diff-panel[data-state="reverted"] { opacity: .72; }
  .diff-panel.flash { animation: flashFrame 1.15s var(--ease); }
  .diff-head {
    min-height: 30px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--faint);
    font-size: 8px;
    line-height: 1.2;
  }
  .diff-type { color: var(--accent); font-size: 7.5px; letter-spacing: .13em; }
  .diff-file {
    color: var(--ink-soft);
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 43%;
  }
  .diff-count { display: inline-flex; align-items: center; gap: 4px; font-size: 8px; letter-spacing: .01em; }
  .diff-count .add { color: var(--accent); }
  .diff-count .del { color: var(--muted); }
  .diff-hunk { margin-left: auto; color: #465143; font-size: 7.5px; }
  .diff-state {
    color: var(--accent);
    border-left: 1px solid var(--line-strong);
    padding-left: 8px;
    font-size: 7.5px;
    letter-spacing: .12em;
  }
  .diff-panel[data-state="reverted"] .diff-state { color: var(--muted); }
  .diff-body { overflow-x: auto; padding: 4px 0; }
  .diff-line {
    display: grid;
    grid-template-columns: 44px 16px minmax(max-content, 1fr);
    min-height: 17px;
    line-height: 17px;
    font-size: 10px;
    white-space: pre;
    border-left: 2px solid transparent;
  }
  .diff-line .ln {
    padding-right: 9px;
    border-right: 1px solid #191e19;
    color: #3d463b;
    text-align: right;
    font-size: 8px;
    user-select: none;
  }
  .diff-line .sign { text-align: center; color: #3d463b; font-size: 9px; user-select: none; }
  .diff-line .code { padding-left: 7px; color: #a9b2a1; }
  .diff-line.add { background: rgba(183, 224, 139, .052); border-left-color: var(--accent-dim); }
  .diff-line.add .sign { color: var(--accent); }
  .diff-line.add .code { color: #c2d5b3; }
  .diff-line.rem { background: rgba(255, 255, 255, .014); }
  .diff-line.rem .code { color: #6f796a; }
  .diff-line.rem .sign { color: #6b7666; }
  .diff-line.ctx .code { color: #7d8777; }
  .diff-line:hover { background: rgba(255, 255, 255, .035); }
  .diff-foot {
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 10px;
    border-top: 1px solid var(--line);
    color: #434d40;
    font-size: 7.5px;
    letter-spacing: .035em;
  }
  .diff-foot .accent { color: var(--accent-dim); }

  .approval-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 55px;
    padding: 8px 10px;
    border: 1px solid var(--accent-line);
    border-top: 0;
    background:
      linear-gradient(90deg, rgba(183, 224, 139, .075), transparent 72%),
      #0b0f0c;
    animation: approvalIn .36s var(--ease) both;
  }
  .approval-signal {
    width: 21px;
    height: 21px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    border: 1px solid var(--accent-line);
    color: var(--accent);
    font-size: 11px;
    line-height: 1;
  }
  .approval-copy { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .approval-title { color: var(--accent); font-size: 8px; letter-spacing: .15em; line-height: 1.35; }
  .approval-file {
    color: var(--ink-soft);
    font-size: 9.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }
  .approval-file b { color: var(--ink); font-weight: 500; }
  .approval-file .muted { color: var(--faint); }
  .approval-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 27px;
    padding: 0 9px;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--muted);
    font-size: 8px;
    letter-spacing: .1em;
    line-height: 1;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover { color: var(--ink); border-color: #465245; background: rgba(255,255,255,.025); }
  .btn.approve { background: var(--accent); border-color: var(--accent); color: #0b1008; }
  .btn.approve:hover { background: var(--accent-bright); border-color: var(--accent-bright); color: #081006; }
  .btn kbd { border-color: currentColor; color: currentColor; opacity: .7; height: 15px; min-width: 15px; font-size: 7.5px; }
  .btn.approve kbd { opacity: .72; }
  .patch-outcome {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    min-height: 28px;
    padding: 5px 10px;
    border: 1px solid var(--line);

  }
  .patch-outcome .ok { color: var(--accent); font-size: 10px; }
  .patch-outcome .out-label { color: var(--ink-soft); letter-spacing: .11em; }
  .patch-outcome .out-meta { color: var(--faint); letter-spacing: .01em; }
  .patch-outcome .out-time { margin-left: auto; color: #475142; font-size: 7.5px; }
  .patch-outcome.reverted .out-label { color: var(--muted); }

  /* ── completion / plan preview / failure ───────────────────────────── */
  .completion {
    margin-top: 16px;
    padding-top: 11px;
    border-top: 1px solid var(--accent-line);
    animation: reveal .3s var(--ease) both;
  }
  .completion-head {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 8px;
    letter-spacing: .14em;
  }
  .completion-head .check {
    width: 15px; height: 15px;
    display: grid; place-items: center;
    background: var(--accent); color: #0b1008;
    font-size: 9px; line-height: 1;
  }
  .completion-head .completion-rule { flex: 1; height: 1px; background: var(--line); }
  .completion-head .duration { color: var(--faint); font-size: 7.5px; letter-spacing: .04em; }
  .completion p {
    margin: 8px 0 0;
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.65;
    max-width: 760px;
  }
  .completion-stats {

    margin-top: 10px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .completion-stat { padding: 7px 10px 7px 0; min-width: 0; }
  .completion-stat + .completion-stat { border-left: 1px solid var(--line); padding-left: 12px; }
  .completion-stat span { display: block; color: var(--faint); font-size: 7.5px; letter-spacing: .1em; text-transform: uppercase; }
  .completion-stat b { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 10px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .completion-stat b.accent { color: var(--accent); }

  .plan-preview {
    margin-top: 14px;
    border: 1px solid var(--line-strong);
    background: #090c0a;
    animation: reveal .3s var(--ease) both;
  }
  .plan-preview-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    color: var(--accent);
    font-size: 8px;
    letter-spacing: .13em;
    background: var(--surface-2);
  }
  .plan-preview-head .plan-preview-meta { margin-left: auto; color: var(--faint); font-size: 7.5px; letter-spacing: .04em; }
  .plan-preview-list { padding: 5px 10px; }
  .plan-preview-step {
    display: grid;
    grid-template-columns: 25px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: baseline;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,.025);
    color: var(--muted);
    font-size: 10.5px;
  }
  .plan-preview-step:last-child { border-bottom: 0; }
  .plan-preview-step > span:first-child { color: var(--accent-dim); font-size: 8px; }
  .plan-preview-step em { color: var(--faint); font-size: 8px; font-style: normal; letter-spacing: .03em; }
  .plan-preview-foot {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 7px 10px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 8px;
    line-height: 1.4;
  }
  .plan-preview-foot > span { flex: 1; }
  .plan-preview-foot .btn { height: 24px; flex: 0 0 auto; }

  .failure-panel {
    margin-top: 14px;
    border: 1px solid var(--line-strong);
    border-top: 2px solid #727d6c;
    background:
      repeating-linear-gradient(135deg, rgba(255, 255, 255, .018) 0, rgba(255, 255, 255, .018) 1px, transparent 1px, transparent 8px),
      #0a0c0a;
    animation: reveal .3s var(--ease) both;
  }
  .failure-head {
    min-height: 30px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--line-strong);

    letter-spacing: .11em;
    color: var(--muted);
  }
  .failure-bang {
    display: grid;
    place-items: center;

    border: 1px solid #697565;
    color: var(--ink);
    font-size: 10px;
  }
  .failure-head .failure-title { color: var(--ink); font-size: 8px; letter-spacing: .14em; }
  .failure-head .failure-exit { margin-left: auto; color: var(--faint); font-size: 7.5px; letter-spacing: .03em; }
  .failure-body { padding: 8px 11px 7px; overflow-x: auto; }
  .failure-line {
    display: grid;
    grid-template-columns: 31px minmax(max-content, 1fr);
    gap: 8px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.65;
  }
  .failure-line .lineno { color: #4b5647; text-align: right; font-size: 8px; padding-top: 1px; }
  .failure-line .fail-code { color: var(--ink-soft); }
  .failure-line.dim .fail-code { color: var(--faint); }
  .failure-foot {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 8px;
    letter-spacing: .02em;
  }
  .failure-foot .failure-note { margin-left: auto; }
  .failure-foot .square { width: 5px; height: 5px; border: 1px solid var(--muted); display: inline-block; }
  .failure-foot .btn { height: 22px; margin-left: 4px; font-size: 7px; }

  .system-event {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0 8px 26px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 9px;
    letter-spacing: .025em;
    animation: reveal .22s var(--ease) both;
  }
  .system-event .sig { color: var(--accent-dim); }
  .system-event strong { color: var(--muted); font-weight: 500; }

  /* ── empty state ────────────────────────────────────────────────────── */
  .empty {
    max-width: 780px;
    padding: clamp(34px, 10vh, 104px) 0 20px;
    animation: turnIn .35s var(--ease) both;
  }
  .empty-kicker {
    display: flex;
    align-items: center;
    gap: 9px;
    color: var(--faint);
    font-size: 8px;
    letter-spacing: .14em;
  }
  .empty-kicker .live-square { width: 5px; height: 5px; background: var(--accent); box-shadow: 0 0 0 3px rgba(183,224,139,.06); }
  .empty-kicker .kicker-line { flex: 1; height: 1px; background: var(--line); }
  .empty-wordmark {
    margin: 33px 0 18px;
    color: var(--ink);
    font-size: clamp(64px, 8.2vw, 104px);
    font-weight: 650;
    letter-spacing: -.095em;
    line-height: .8;
    user-select: none;
  }
  .empty-wordmark .last { color: var(--accent); }
  .empty-title {
    margin: 0;
    color: var(--ink);
    font-size: clamp(21px, 2.6vw, 30px);
    font-weight: 500;
    letter-spacing: -.045em;
    line-height: 1.3;
  }
  .empty-sub {
    max-width: 520px;
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 11.5px;
    line-height: 1.7;
  }
  .empty-suggestions { margin-top: 30px; border-top: 1px solid var(--line-strong); }
  .empty-suggestions-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 0 6px;
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .suggestion {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) auto;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 37px;
    padding: 6px 5px 6px 0;
    border-top: 1px solid var(--line);
    color: var(--ink-soft);
    text-align: left;
    font-size: 11.5px;
    transition: background .15s, color .15s, padding .15s;
  }
  .suggestion:hover { background: var(--accent-wash); color: var(--ink); padding-left: 8px; }
  .suggestion .sugg-index { color: var(--faint); font-size: 8px; }
  .suggestion:hover .sugg-index { color: var(--accent-dim); }
  .suggestion .sugg-arrow { color: var(--faint); font-size: 10px; transition: color .15s, transform .15s; }
  .suggestion:hover .sugg-arrow { color: var(--accent); transform: translateX(2px); }
  .empty-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    color: #465142;
    font-size: 8px;
    letter-spacing: .04em;
  }
  .empty-foot .dot { color: #334032; }
  .empty-foot .push { margin-left: auto; color: var(--faint); }

  /* ── composer ───────────────────────────────────────────────────────── */
  .composer-zone {
    position: relative;
    z-index: 25;
    flex: 0 0 auto;
    padding: 7px 0 9px;
    border-top: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(9, 12, 10, .55) 0%, #090b0a 20%, #090b0a 100%);
  }
  .composer {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 34px;
    position: relative;
  }
  .composer-meta {
    height: 19px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .composer-meta-left { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .composer-eyebrow { color: var(--muted); }
  .composer-context { color: #45503f; text-transform: none; letter-spacing: .015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .composer-context.warn { color: var(--accent-dim); }
  .composer-hints { display: flex; align-items: center; gap: 14px; color: #414b3f; white-space: nowrap; letter-spacing: .03em; text-transform: none; }
  .composer-hints .hint-key { color: var(--faint); }
  .prompt-shell {
    display: grid;
    grid-template-columns: 29px minmax(0, 1fr);
    border: 1px solid var(--line-strong);
    background: #0a0d0b;
    transition: border-color .18s, box-shadow .18s;
  }
  .prompt-shell:focus-within {
    border-color: var(--accent-line);
    box-shadow: 0 0 0 1px rgba(183, 224, 139, .045), 0 -9px 38px rgba(0, 0, 0, .16);
  }
  .prompt-sigil {
    color: var(--accent);
    font-size: 15px;
    line-height: 1;
    padding: 13px 0 0 11px;
    user-select: none;
  }
  .prompt-input {
    width: 100%;
    min-height: 46px;
    max-height: 146px;
    margin: 0;
    padding: 10px 12px 9px 0;
    border: 0;
    outline: 0 !important;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.6;
    resize: none;
    overflow-y: auto;
    caret-color: var(--accent);
    scrollbar-width: thin;
  }
  .prompt-input::placeholder { color: #515d4d; opacity: 1; }
  .prompt-footer {
    grid-column: 1 / -1;
    min-height: 31px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 7px 0 10px;
    border-top: 1px solid var(--line);
  }
  .mode-switch { display: flex; align-items: center; gap: 1px; height: 24px; }
  .mode-btn {
    height: 23px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 7px;
    color: var(--faint);
    font-size: 8px;
    letter-spacing: .1em;
    transition: color .15s, background .15s;
  }
  .mode-btn:hover { color: var(--muted); }
  .mode-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-wash); }
  .mode-glyph { color: currentColor; font-size: 7px; }
  .mode-btn:disabled { opacity: .48; }
  .prompt-actions { display: flex; align-items: center; gap: 12px; }
  .approval-mode {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #46513f;
    font-size: 7.5px;
    letter-spacing: .09em;
    white-space: nowrap;
  }
  .approval-mode .tiny-dot { width: 4px; height: 4px; border: 1px solid var(--accent-dim); border-radius: 50%; }
  .send-btn {
    height: 23px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 8px;
    border: 1px solid var(--line-strong);
    color: var(--ink-soft);
    font-size: 8px;
    letter-spacing: .1em;
    transition: background .15s, border-color .15s, color .15s, opacity .15s;
  }
  .send-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: #0b1008; }
  .send-btn:hover:not(:disabled) kbd { border-color: #0b1008; color: #0b1008; }
  .send-btn:disabled { opacity: .36; }
  .send-btn .send-arrow { font-size: 11px; line-height: 1; color: var(--accent-dim); }
  .send-btn:hover:not(:disabled) .send-arrow { color: #0b1008; }
  .send-btn .mini-spinner { width: 7px; height: 7px; border: 1px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  .send-btn .send-label { white-space: nowrap; }

  .completion-pop {
    position: absolute;
    z-index: 45;
    left: 50%;
    bottom: calc(100% - 1px);
    transform: translateX(-50%);
    width: min(calc(100% - 68px), 892px);
    border: 1px solid var(--line-strong);
    background: #0b0f0c;
    box-shadow: 0 -18px 60px rgba(0, 0, 0, .62), 0 0 0 1px rgba(183, 224, 139, .025);
    animation: popIn .16s var(--ease) both;
  }
  .completion-pop .completion-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .13em;
    text-transform: uppercase;
    background: var(--surface-2);
  }
  .completion-pop .completion-head strong { color: var(--ink-soft); font-weight: 500; }
  .completion-pop .completion-head .completion-hint { display: inline-flex; align-items: center; gap: 8px; color: #465142; letter-spacing: .025em; text-transform: none; font-size: 7.5px; white-space: nowrap; }
  .completion-pop .completion-head .completion-hint > span { display: inline-flex; align-items: center; gap: 2px; }
  .completion-pop .completion-head .completion-hint kbd { margin: 0 1px; }
  .completion-items { max-height: 248px; overflow-y: auto; padding: 3px 0; }
  .completion-item {
    display: grid;
    grid-template-columns: 25px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 35px;
    padding: 5px 10px 5px 12px;
    border-left: 1px solid transparent;
    text-align: left;
    transition: background .12s, border-color .12s;
  }
  .completion-item:hover { background: rgba(255,255,255,.022); }
  .completion-item.is-active { background: var(--accent-wash); border-left-color: var(--accent); }
  .ci-mark { color: var(--accent-dim); font-size: 10px; }
  .completion-item.is-active .ci-mark { color: var(--accent); }
  .ci-main { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
  .ci-title { color: var(--ink-soft); font-size: 10.5px; white-space: nowrap; }
  .completion-item.is-active .ci-title { color: var(--accent-bright); }
  .ci-desc { color: var(--faint); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-key { color: #45503f; font-size: 7.5px; letter-spacing: .04em; border: 1px solid var(--line); padding: 1px 4px; }
  .completion-empty { padding: 17px 12px; color: var(--faint); font-size: 9.5px; }
  .completion-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 24px;
    padding: 4px 10px;
    border-top: 1px solid var(--line);
    color: #414b3f;
    font-size: 7.5px;
    letter-spacing: .02em;
  }
  .completion-foot .accent { color: var(--accent-dim); }

  /* ── plan rail ──────────────────────────────────────────────────────── */
  .rail {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(183, 224, 139, .022), transparent 22%),
      #090c0a;
    position: relative;
    z-index: 18;
  }
  .rail-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 17px 17px 16px;
    display: flex;
    flex-direction: column;
  }
  .rail-head {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 16px;
    color: var(--faint);
    font-size: 8px;
    letter-spacing: .15em;
    text-transform: uppercase;
  }
  .rail-head .eyebrow { color: var(--ink-soft); font-weight: 600; }
  .rail-head .rail-state { margin-left: 4px; color: var(--accent-dim); font-size: 7.5px; letter-spacing: .09em; }
  .rail-head .rail-state[data-tone="muted"] { color: var(--muted); }
  .rail-head .rail-state[data-tone="blocked"] { color: var(--ink-soft); }
  .rail-head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .plan-fraction { color: var(--ink-soft); font-size: 9px; letter-spacing: .03em; }
  .plan-fraction span { color: var(--faint); }
  .rail-close {
    display: none;
    width: 24px; height: 24px;
    align-items: center; justify-content: center;
    border: 1px solid var(--line-strong);
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
  }
  .rail-close:hover { color: var(--accent); border-color: var(--accent-line); }
  .plan-name {
    margin-top: 11px;
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.4;
    letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }
  .plan-progress {
    height: 2px;
    margin-top: 9px;
    background: #1c231c;
    overflow: hidden;
  }
  .plan-progress i { display: block; height: 100%; width: 50%; background: var(--accent-dim); transition: width .5s var(--ease); }
  .plan-list { margin: 10px 0 0; padding: 0; list-style: none; }
  .plan-item {
    position: relative;
    display: grid;
    grid-template-columns: 23px minmax(0, 1fr);
    gap: 7px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .022);
  }
  .plan-item:last-child { border-bottom: 0; }
  .plan-item::after {
    content: "";
    position: absolute;
    right: 0; top: 11px; bottom: 11px;
    width: 1px;
    background: transparent;
  }
  .plan-item.active::after { background: var(--accent); opacity: .65; }
  .plan-number { padding-top: 1px; color: #465141; font-size: 8px; letter-spacing: .04em; white-space: nowrap; }
  .plan-item.done .plan-number { color: var(--accent-dim); }
  .plan-item.active .plan-number { color: var(--accent); }
  .plan-item.failed .plan-number { color: var(--muted); }
  .plan-copy { min-width: 0; }
  .plan-title { display: block; color: var(--ink-soft); font-size: 10.5px; line-height: 1.45; overflow-wrap: anywhere; }
  .plan-item.done .plan-title { color: #727c6e; }
  .plan-item.active .plan-title { color: var(--ink); }
  .plan-item.failed .plan-title { color: var(--ink-soft); }
  .plan-note { display: block; margin-top: 1px; color: #4a5547; font-size: 8px; line-height: 1.45; letter-spacing: .015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan-item.active .plan-note { color: var(--accent-dim); }
  .plan-item.failed .plan-note { color: var(--muted); }
  .plan-void {
    padding: 30px 0 22px;
    text-align: left;
  }
  .plan-void .void-glyph { color: var(--line-strong); font-size: 25px; line-height: 1; }
  .plan-void p { margin: 9px 0 0; color: var(--muted); font-size: 11px; }
  .plan-void span { display: block; margin-top: 3px; color: var(--faint); font-size: 9px; line-height: 1.5; }

  .rail-section { margin-top: 18px; }
  .rail-section-head {
    display: flex;
    align-items: center;
    gap: 7px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    color: var(--faint);
    font-size: 7.5px;
    letter-spacing: .14em;

  }
  .rail-section-head .section-count { color: #465040; font-size: 7.5px; letter-spacing: .02em; }

  .file-list { padding-top: 3px; }
  .file-row {

    gap: 7px;

  }

  .file-base { color: var(--ink-soft); }

  .file-stats { color: var(--accent-dim); font-size: 8px; white-space: nowrap; }
  .file-stats .minus { color: #657161; margin-left: 3px; }
  .rail-empty-row { color: #465142; font-size: 9px; line-height: 1.6; padding: 7px 0 4px; }

  .queue-card { margin-top: 8px; border: 1px solid var(--accent-line); background: rgba(183, 224, 139, .025); }
  .queue-topline {

  .queue-meta { padding: 0 7px 7px; color: var(--faint); font-size: 8px; }
  .queue-actions { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid rgba(183, 224, 139, .13); }

  .queue-note.warn { color: var(--muted); }
  .rail-session {
    margin-top: auto;
    padding-top: 20px;
  }
  .rail-session-lines { padding-top: 3px; }
  .session-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    min-height: 22px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255, 255, 255, .018);
    font-size: 8.5px;
    line-height: 1.4;
  }
  .session-line:last-child { border-bottom: 0; }
  .session-line span { color: #586253; letter-spacing: .04em; }
  .session-line b { color: var(--muted); font-weight: 400; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-line b.accent { color: var(--accent-dim); }
  .rail-bottom {
    flex: 0 0 auto;
    min-height: 33px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 17px;
    border-top: 1px solid var(--line);
    color: #414b3e;
    font-size: 7.5px;
    letter-spacing: .035em;
  }
  .rail-keyline { display: inline-flex; align-items: center; gap: 6px; }

  /* ── command palette overlay ────────────────────────────────────────── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: center;

    background: rgba(4, 6, 5, .73);
    backdrop-filter: blur(4px);
    animation: overlayIn .15s ease both;
  }
  .palette {
    width: min(620px, calc(100vw - 32px));

  .palette-close {
    margin-left: auto;
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;

  }
  .palette-close:hover { color: var(--accent); border-color: var(--line-strong); }
  .palette-search {

    align-items: center;
    gap: 9px;
    padding: 0 11px;

  }
  .palette-search .search-glyph { color: var(--accent); font-size: 14px; }
  .palette-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0 !important;
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    letter-spacing: .005em;
    caret-color: var(--accent);
  }
  .palette-input::placeholder { color: #4c5848; }
  .palette-count { color: #495445; font-size: 8px; letter-spacing: .02em; white-space: nowrap; }
  .palette-list {
    min-height: 120px;
    overflow-y: auto;
    padding: 4px 0 5px;
    scrollbar-gutter: stable;
  }
  .palette-group {
    padding: 7px 12px 4px;
    color: #414b3f;
    font-size: 7px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .palette-item {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-height: 42px;
    padding: 5px 12px 5px 13px;

    text-align: left;
    transition: background .1s, border-color .1s;
  }
  .palette-item:hover { background: rgba(255,255,255,.022); }
  .palette-item.is-selected { border-left-color: var(--accent); background: var(--accent-wash); }
  .palette-glyph { color: var(--faint); font-size: 10px; text-align: center; }
  .palette-item.is-selected .palette-glyph { color: var(--accent); }
  .palette-item-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .palette-item-label { color: var(--ink-soft); font-size: 11px; line-height: 1.35; }
  .palette-item.is-selected .palette-item-label { color: var(--accent-bright); }
  .palette-item-desc { color: var(--faint); font-size: 8.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .palette-item-key {
    color: #465142;
    font-size: 7.5px;
    border: 1px solid var(--line);
    padding: 1px 5px;
    white-space: nowrap;
  }
  .palette-no-results { padding: 27px 13px; color: var(--faint); font-size: 10px; }
  .palette-no-results b { color: var(--muted); font-weight: 400; }
  .palette-foot {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 30px;
    padding: 0 11px;
    border-top: 1px solid var(--line);
    color: #414b3f;
    font-size: 7.5px;
    white-space: nowrap;
  }
  .palette-foot .keyline { display: inline-flex; align-items: center; gap: 5px; }
  .palette-foot .palette-wordmark { margin-left: auto; color: #414b3f; letter-spacing: .05em; }
  .palette-foot .palette-wordmark b { color: var(--accent-dim); font-weight: 500; }

  /* ── toasts ─────────────────────────────────────────────────────────── */
  .toast-stack {
    position: fixed;
    right: 18px;
    bottom: 126px;
    z-index: 120;
    width: max-content;
    max-width: min(calc(var(--rail-w) - 36px), 520px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    pointer-events: none;
  }
  .toast {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 30px;
    padding: 6px 10px;
    border: 1px solid var(--line-strong);
    background: #101510;
    color: var(--ink-soft);
    font-size: 9.5px;
    line-height: 1.4;
    box-shadow: 0 8px 34px rgba(0, 0, 0, .48);
    animation: toastIn .22s var(--ease) both;
  }
  .toast .toast-mark { color: var(--accent); font-size: 10px; }
  .toast[data-tone="muted"] .toast-mark { color: var(--muted); }
  .toast.is-leaving { animation: toastOut .18s ease both; }

  /* ── responsive ─────────────────────────────────────────────────────── */
  @media (max-width: 1260px) {
    :root { --rail-w: 326px; }
    .meta-strip { gap: 15px; }
    .meta-item.branch { display: none; }
    .feed-inner, .composer { padding-left: 27px; padding-right: 27px; }
    .completion-pop { width: min(calc(100% - 54px), 892px); }
  }
  @media (max-width: 1120px) {
    .meta-item .meta-label { display: none; }
    .meta-strip { gap: 17px; }
    .context { width: 96px; }
    .brand-group { gap: 9px; }
    .session-name { max-width: 130px; }
    .topbar { gap: 13px; }
    .top-actions { gap: 8px; }
  }
  @media (max-width: 980px) {

      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(370px, 92vw);
      transform: translateX(103%);
      transition: transform .28s var(--ease);
      box-shadow: -32px 0 90px rgba(0, 0, 0, .72);
      z-index: 60;
    }
    .drawer-open .rail { transform: translateX(0); }
    .drawer-open .drawer-scrim { display: block; }
    .rail-close { display: inline-flex; }
    .drawer-btn { display: inline-flex; }
    .feed-inner, .composer { max-width: 860px; padding-left: 28px; padding-right: 28px; }
    .completion-pop { width: min(calc(100% - 56px), 892px); }
    .toast-stack {
      left: 50%;
      right: auto;
      top: 78px;
      bottom: auto;
      transform: translateX(-50%);
      align-items: center;
      max-width: calc(100vw - 24px);
    }
  }
  @media (max-width: 760px) {
    .topbar {
      flex-wrap: wrap;
      gap: 6px 12px;
      padding: 8px 12px 7px;
      min-height: 0;
    }
    .brand-group { flex: 1 1 auto; }
    .brand-sub { display: none; }
    .session-name { max-width: 120px; }
    .top-divider { height: 15px; }
    .meta-strip {
      order: 3;
      flex-basis: 100%;
      justify-content: space-between;
      gap: 12px;
      margin-left: 0;
      padding-top: 7px;
      border-top: 1px solid var(--line);
    }
    .meta-label { display: none; }
    .meta-value { font-size: 9px; }
    .meta-item.cwd .meta-value { max-width: 102px; overflow: hidden; text-overflow: ellipsis; }
    .context { width: 92px; gap: 3px; }
    .context-head { font-size: 7px; }
    .context-head b { font-size: 8px; letter-spacing: .02em; }
    .top-actions { gap: 7px; margin-left: auto; }
    .run-status { min-width: 0; gap: 5px; }
    .status-label { font-size: 7.5px; letter-spacing: .08em; }
    .status-detail { display: none; }
    .key-button { height: 25px; }
    .drawer-btn { padding: 0 6px; gap: 5px; }
    .drawer-btn .drawer-word { display: none; }
    .drawer-glyph { color: var(--accent-dim); font-size: 10px; line-height: 1; }
    .feed-inner { padding: 12px 14px 19px; }
    .composer { padding: 0 12px; }
    .composer-zone { padding: 6px 0 max(8px, env(safe-area-inset-bottom)); }
    .composer-meta { height: 18px; gap: 8px; }
    .composer-hints { gap: 9px; }
    .composer-hints .hint-extra { display: none; }
    .prompt-shell { grid-template-columns: 23px minmax(0, 1fr); }
    .prompt-sigil { padding-left: 8px; font-size: 13px; padding-top: 12px; }
    .prompt-input { padding: 9px 8px 8px 0; font-size: 12.5px; min-height: 43px; }
    .prompt-footer { padding-left: 6px; padding-right: 5px; }
    .mode-btn { padding: 0 6px; }
    .send-btn { padding: 0 6px; gap: 5px; }
    .approval-mode { display: none; }
    .prompt-actions { gap: 7px; }
    .completion-pop { width: calc(100% - 24px); bottom: calc(100% - 1px); }
    .completion-pop .completion-head { padding: 6px 8px; }
    .completion-pop .completion-head .completion-hint { font-size: 7px; }
    .ci-main { flex-direction: column; align-items: flex-start; gap: 0; }
    .ci-desc { max-width: 100%; }
    .completion-item { min-height: 38px; padding-left: 9px; }
    .toast { font-size: 9px; }

    .system-row { gap: 7px; font-size: 8px; }
    .system-row .sys-base, .system-row .sys-base-sep { display: none; }
    .system-row .sys-right { display: none; }
    .turn { padding-left: 19px; }
    .turn-head { gap: 7px; }
    .turn-route { font-size: 7px; }
    .user-copy { font-size: 12.5px; line-height: 1.65; }
    .agent-copy { font-size: 12px; }
    .reasoning-body { margin-left: 11px; }
    .diff-head { flex-wrap: wrap; gap: 5px 7px; padding: 6px 8px; }
    .diff-file { max-width: 55%; font-size: 9.5px; }

    .diff-state { margin-left: auto; }
    .diff-line { grid-template-columns: 35px 14px minmax(max-content, 1fr); font-size: 9.5px; }
    .diff-line .ln { padding-right: 6px; font-size: 7.5px; }
    .diff-line .code { padding-left: 5px; }
    .diff-foot { font-size: 7px; }
    .approval-bar { flex-wrap: wrap; align-items: flex-start; gap: 8px; padding: 8px; }
    .approval-copy { flex-basis: calc(100% - 31px); }
    .approval-actions { width: 100%; justify-content: flex-end; }
    .approval-actions .btn { height: 28px; }
    .patch-outcome { font-size: 7.5px; }
    .patch-outcome .out-time { margin-left: 0; }
    .completion-stats { grid-template-columns: 1fr 1fr; }
    .completion-stat:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
    .completion-stat:nth-child(4) { border-top: 1px solid var(--line); }
    .plan-preview-step { grid-template-columns: 22px minmax(0, 1fr); }
    .plan-preview-step em { grid-column: 2; }
    .plan-preview-foot { flex-wrap: wrap; }
    .plan-preview-foot > span { flex-basis: 100%; }
    .failure-line { font-size: 9px; }
    .failure-line { grid-template-columns: 26px minmax(max-content, 1fr); }
    .empty { padding-top: clamp(26px, 8vh, 70px); }
    .empty-title { font-size: 22px; }
    .empty-wordmark { margin-top: 26px; }
    .empty-sub { font-size: 11px; }

    .overlay { padding-top: 8vh; padding-left: 12px; padding-right: 12px; }
    .palette { width: 100%; max-height: 80vh; }
    .palette-head { min-height: 31px; }
    .palette-search { min-height: 47px; }
    .palette-item { min-height: 44px; }
    .palette-foot { gap: 9px; font-size: 7px; }
    .palette-foot .foot-extra { display: none; }
    .rail-scroll { padding: 16px 16px 14px; }
    .rail-bottom { padding: 0 16px; }
  }
  @media (max-width: 430px) {
    .topbar { gap: 5px 9px; }
    .brand-word { font-size: 14px; }
    .brand-mark { width: 13px; height: 13px; }
    .session { font-size: 10px; gap: 3px; }
    .session-name { max-width: 72px; }
    .top-actions { gap: 5px; }
    .status-copy { gap: 0; }
    .status-label { font-size: 7px; }
    .key-button { min-width: 28px; height: 24px; padding: 0 5px; font-size: 8px; }
    .drawer-btn { height: 24px; min-width: 42px; }
    .meta-strip { gap: 8px; }
    .meta-value { font-size: 8.5px; }
    .meta-item.cwd .meta-value { max-width: 68px; }
    .context { width: 79px; }
    .context-head { font-size: 6.5px; }
    .context-head b { font-size: 7.5px; }
    .composer-hints { display: none; }
    .prompt-footer { gap: 4px; }
    .mode-btn { font-size: 7.5px; padding: 0 5px; }
    .send-btn { font-size: 7.5px; padding: 0 5px; }
    .send-btn .send-arrow { font-size: 10px; }
    .empty-wordmark { font-size: 66px; }
    .empty-foot { flex-wrap: wrap; gap: 4px 7px; }
    .empty-foot .push { width: 100%; margin-left: 0; }
    .suggestion { font-size: 11px; }
    .palette-item-desc { max-width: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .36; } }
  @keyframes turnIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes reveal { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }
  @keyframes approvalIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  @keyframes flashFrame { 0% { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(183,224,139,.10); } 100% { border-color: var(--line-strong); box-shadow: none; } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(4px); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes paletteIn { from { opacity: 0; transform: translateY(-7px) scale(.993); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: translateX(-50%) translateY(4px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>

<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand-group">
      <div class="brand" aria-label="nulo">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand-word">nulo</span>
        <span class="brand-sub" id="brandMode">/ build</span>
      </div>
      <span class="top-divider" aria-hidden="true"></span>
      <div class="session" title="Session name">
        <span class="session-prefix" aria-hidden="true">#</span>
        <span class="session-name" id="sessionName">settings-shortcuts</span>
      </div>
    </div>

    <div class="meta-strip" aria-label="Session details">
      <div class="meta-item model">
        <span class="meta-label">MODEL</span>
        <span class="meta-value">grok-code-fast-1</span>
      </div>
      <div class="meta-item cwd">
        <span class="meta-label">CWD</span>
        <span class="meta-value" title="/Users/crazy/Downloads/nulo">~/nulo</span>
      </div>
      <div class="context" aria-label="Context usage">
        <div class="context-head">
          <span>CTX</span>
          <span><b id="ctxUsed">41.8k</b> / 128k</span>
        </div>
        <div class="context-track"><span class="context-fill" id="ctxFill"></span></div>
      </div>
    </div>

    <div class="top-actions">
      <button class="key-button drawer-btn" id="drawerBtn" type="button" aria-label="Open plan panel" aria-expanded="false">
        <span class="drawer-glyph" aria-hidden="true">▤</span><span class="drawer-word">PLAN</span><b id="drawerCount">2/4</b>
      </button>
      <div class="run-status" id="runStatus" data-state="awaiting" role="status" aria-live="polite">
        <span class="status-light" aria-hidden="true"></span>

<script>
(() => {
  "use strict";

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const pad = (n) => String(n).padStart(2, "0");

  const richText = (value) => esc(value).replace(/`([^`]+)`/g, "<code>$1</code>");

  const el = {
    feed: $("#feed"),

    input: $("#promptInput"),
    send: $("#sendBtn"),
    composerContext: $("#composerContext"),
    runStatus: $("#runStatus"),
    sessionName: $("#sessionName"),
    statusLabel: $("#statusLabel"),
    statusDetail: $("#statusDetail"),
    contextUsed: $("#ctxUsed"),
    contextFill: $("#ctxFill"),
    brandMode: $("#brandMode"),
    rail: $("#rail"),
    railScroll: $("#railScroll"),
    drawerBtn: $("#drawerBtn"),
    drawerCount: $("#drawerCount"),
    drawerScrim: $("#drawerScrim"),
    completionPop: $("#completionPop"),
    paletteOverlay: $("#paletteOverlay"),
    paletteInput: $("#paletteInput"),
    paletteList: $("#paletteList"),
    paletteCount: $("#paletteCount"),
    paletteClose: $("#paletteClose"),
    paletteBtn: $("#paletteBtn"),
    toastStack: $("#toastStack"),
  };

  const KEYMAP_DIFF = {
    file: "internal/tui/keymap.go",
    add: 8,
    del: 2,
    hunk: "@@ -74,6 +74,12 @@",
    lines: [
      { n: 74, type: "ctx", code: "func (m model) updateKeys(msg tea.KeyMsg) (tea.Model, tea.Cmd) {" },
      { n: 75, type: "ctx", code: "    switch key := msg.String(); key {" },

  const FILES = [

  const MENTION_FILES = [

    "internal/tui/command_palette.go",
    "internal/tui/root.go",
    "internal/tui/theme.go",
    "sdk/session.go",
    "sdk/runtime.go",

  const state = {
    mode: "build",

    completed: false,

    planReady: false,

      { title: "定位 command registry 与按键入口", state: "done", note: "4 files · 21 matches" },

  const completion = { open: false, mode: null, items: [], index: 0, start: 0, end: 0, query: "" };

  const STATUS = {

    ready: ["READY", "awaiting input"],
    running: ["WORKING", "streaming"],
    awaiting: ["AWAITING", "patch review"],

  const slashCommands = [
    { command: "/plan", title: "/plan", desc: "切换只读规划模式", key: "P" },
    { command: "/diff", title: "/diff", desc: "定位当前补丁预览", key: "D" },
    { command: "/approve", title: "/approve", desc: "批准并应用待审补丁", key: "A" },
    { command: "/clear", title: "/clear", desc: "清空当前会话", key: "⌫" },

  function splitPath(path) {
    const index = path.lastIndexOf("/");
    return index === -1 ? ["", path] : [path.slice(0, index + 1), path.slice(index + 1)];
  }

  function planMark(item, index) {
    const marks = { done: "[x]", active: "[~]", pending: "[ ]", failed: "[!]" };
    return `
      <li class="plan-item ${item.state}">
        <span class="plan-number">${marks[item.state] || "[ ]"}</span>
        <span class="plan-copy">
          <span class="plan-title">${esc(item.title)}</span>
          ${item.note ? `<span class="plan-note">${esc(item.note)}</span>` : ""}
        </span>
      </li>`;
  }

  function fileMarkup(file) {
    const [dir, base] = splitPath(file.path);
    return `
      <div class="file-row ${file.pending ? "pending" : ""}" title="${esc(file.path)}">
        <span class="file-mark">${file.state}</span>
        <span class="file-name"><span class="file-dir">${esc(dir)}</span><span class="file-base">${esc(base)}</span></span>
        <span class="file-stats">+${file.add}<span class="minus">−${file.del}</span></span>
      </div>`;
  }

  function renderRail() {
    const scrollTop = el.railScroll.scrollTop;
    const done = state.plan.filter((item) => item.state === "done").length;
    const progress = state.plan.length ? (done / state.plan.length) * 100 : 0;
    const pending = state.pending;
    const sessionTag = state.session === "new-session" ? "NEW" : "7F3A";
    const railState = state.completed
      ? "COMPLETE"
      : state.failed
        ? "BLOCKED"
        : state.running
          ? "RUNNING"
          : state.awaiting
            ? "REVIEW"
            : state.plan.length
              ? "OPEN"
              : "IDLE";
    const tone = state.failed ? "blocked" : state.completed || state.awaiting ? "muted" : "";
    const planStatusText = state.planReady ? "PROPOSED" : railState;
    const queued = pending ? 1 : 0;

    const planMarkup = state.plan.length
      ? state.plan.map(planMark).join("")
      : `<div class="plan-void">
          <div class="void-glyph" aria-hidden="true">+</div>
          <p>No plan loaded.</p>
          <span>Send a request, or type /plan<br>to map the work first.</span>
        </div>`;

    const filesMarkup = state.files.length
      ? state.files.map(fileMarkup).join("")
      : `<div class="rail-empty-row"><span class="empty-mark">—</span>No files changed.</div>`;

    let queueMarkup = "";
    if (pending) {
      queueMarkup = `
        <div class="queue-card">
          <div class="queue-topline">
            <span class="queue-id">01</span>
            <span>WRITE PROPOSED</span>
            <span class="queue-state">PENDING</span>
          </div>
          <button class="queue-file" type="button" data-action="scroll-diff" title="Review patch in transcript">
            <b>${esc(pending.file.split("/").pop())}</b><br><span>${esc(pending.file.split("/").slice(0, -1).join("/") + "/")}</span>
          </button>
          <div class="queue-meta">patch · +${pending.add} −${pending.del} · atomic</div>
          <div class="queue-actions">
            <button class="btn" type="button" data-action="reject">REJECT</button>
            <button class="btn approve" type="button" data-action="approve">APPROVE</button>
          </div>
        </div>`;
    } else {
      queueMarkup = `
        <div class="queue-empty">
          <span class="queue-check" aria-hidden="true">✓</span>
          <span>${state.completed ? "Queue clear." : state.failed ? "No changes queued." : "No pending approvals."}</span>
        </div>
        <p class="queue-note ${state.failed ? "warn" : ""}">${
          state.failed
            ? "Run is blocked. Nothing was written."
            : state.completed
              ? "All patches applied. Worktree is consistent."
              : "Write operations will pause here for review."
        }</p>`;
    }

    el.railScroll.innerHTML = `
      <div class="rail-head">
        <span class="eyebrow">PLAN</span>
        <span class="rail-state" data-tone="${tone}">${planStatusText}</span>
        <span class="rail-head-right">
          <span class="plan-fraction">${String(done).padStart(2, "0")} <span>/ ${String(state.plan.length).padStart(2, "0")}</span></span>
          <button class="rail-close" type="button" data-action="close-drawer" aria-label="Close plan panel">×</button>
        </span>
      </div>
      <div class="plan-name" title="${esc(state.objective || "Untitled task")}">${esc(state.objective || "No active task")}</div>
      <div class="plan-progress" aria-hidden="true"><i style="width:${progress}%"></i></div>
      <ol class="plan-list">${planMarkup}</ol>
      <section class="rail-section">
        <div class="rail-section-head">CHANGED FILES <span class="section-count ${state.files.length ? "has-items" : ""}">${String(state.files.length).padStart(2, "0")}</span></div>
        <div class="file-list">${filesMarkup}</div>
      </section>
      <section class="rail-section">
        <div class="rail-section-head">APPROVALS <span class="section-count ${queued ? "has-items" : ""}">${String(queued).padStart(2, "0")}</span></div>
        ${queueMarkup}
      </section>
      <section class="rail-section rail-session">
        <div class="rail-section-head">SESSION <span class="section-count">${sessionTag}</span></div>
        <div class="rail-session-lines">
          <div class="session-line"><span>branch</span><b>feat/command-palette</b></div>
          <div class="session-line"><span>base</span><b>082f08a</b></div>
          <div class="session-line"><span>mode</span><b class="accent">${state.mode} · ${state.mode === "build" ? "approvals on" : "read only"}</b></div>
        </div>
      </section>`;
    el.railScroll.scrollTop = scrollTop;
    el.drawerCount.textContent = `${done}/${state.plan.length}`;
    el.drawerBtn.setAttribute("aria-expanded", document.body.classList.contains("drawer-open") ? "true" : "false");
  }

  function renderContext() {
    el.contextUsed.textContent = `${state.used.toFixed(1)}k`;
    el.contextFill.style.width = `${Math.max(0, Math.min(100, (state.used / state.total) * 100))}%`;
  }

  function setStatus(kind, label, detail) {
    const fallback = STATUS[kind] || STATUS.idle;
    el.runStatus.dataset.state = kind;
    el.statusLabel.textContent = label || fallback[0];
    el.statusDetail.textContent = detail || fallback[1];
  }

  function addContext(amount) {
    state.used = Math.min(state.total, state.used + amount);
    renderContext();
  }

  function updateComposer() {
    const hasText = el.input.value.trim().length > 0;
    el.send.disabled = state.running || !hasText;
    el.send.setAttribute("aria-busy", state.running ? "true" : "false");
    el.send.innerHTML = state.running
      ? `<span class="mini-spinner" aria-hidden="true"></span><span class="send-label">RUNNING</span>`
      : `<span class="send-label">RUN</span><span class="send-arrow" aria-hidden="true">↵</span>`;
    $$(".mode-btn").forEach((button) => {
      button.disabled = state.running;
      button.setAttribute("aria-pressed", button.dataset.mode === state.mode ? "true" : "false");
    });
    el.brandMode.textContent = state.mode === "build" ? "/ build" : "/ plan";
    if (state.running) {
      el.input.placeholder = "Agent is working. You can keep typing…";
      el.composerContext.textContent = "streaming tool output";
      el.composerContext.classList.remove("warn");
    } else if (state.awaiting) {
      el.input.placeholder = "Review the patch above, or type /approve …";
      el.composerContext.textContent = "1 patch awaiting approval";
      el.composerContext.classList.add("warn");
    } else {
      el.input.placeholder = state.mode === "plan"
        ? "Plan the change. / for commands · @ to reference a file."
        : "Describe the change. Type / for commands or @ to reference a file.";
      el.composerContext.textContent = state.mode === "plan" ? "read-only · writes disabled" : "direct input · @ to reference";
      el.composerContext.classList.toggle("warn", state.mode === "plan");
    }
    const disabled = state.mode === "plan";
    $$(".approval-mode").forEach((node) => {
      node.style.opacity = disabled ? ".35" : "";
    });
  }

  function setMode(mode, options = {}) {
    if (state.running && !options.force) {
      showToast("Mode is locked while the agent is working.", { tone: "muted", mark: "!" });
      return;
    }
    state.mode = mode;
    updateComposer();
    renderRail();
    if (!options.quiet) {
      showToast(mode === "build" ? "Build mode · writes require approval." : "Plan mode · writes are disabled.", {
        mark: mode === "build" ? "▪" : "□",
      });
      if (mode === "plan") {
        appendSystemEvent("Mode switched to <strong>PLAN</strong> · read-only analysis");
      }
    }
  }

  function toggleReasoning(button) {
    const expanded = button.getAttribute("aria-expanded") === "true";
    button.setAttribute("aria-expanded", expanded ? "false" : "true");
    const body = button.nextElementSibling;
    if (body && body.classList.contains("reasoning-body")) body.hidden = expanded;
  }

  function appendSystemEvent(html) {
    const node = document.createElement("div");
    node.className = "system-event";
    node.innerHTML = `<span class="sig" aria-hidden="true">⌁</span><span>${html}</span>`;
    el.feedInner.appendChild(node);
    scrollFeed();
  }

  function scrollFeed(force = false) {
    if (force || feedStick) el.feed.scrollTop = el.feed.scrollHeight;
  }

  function clearToasts() {
    Array.from(el.toastStack.children).forEach((toast) => toast.remove());
  }

  function showToast(message, options = {}) {
    const id = ++toastSeq;
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.dataset.tone = options.tone || "accent";
    toast.dataset.id = String(id);
    toast.innerHTML = `<span class="toast-mark" aria-hidden="true">${esc(options.mark || "✓")}</span><span>${esc(message)}</span>`;
    el.toastStack.appendChild(toast);
    while (el.toastStack.children.length > 1) el.toastStack.firstElementChild.remove();
    window.setTimeout(() => {
      toast.classList.add("is-leaving");
      window.setTimeout(() => toast.remove(), 190);
    }, options.duration || 2800);
  }

  function diffMarkup(diff, stateName = "pending", diffId = "diff") {
    const stateLabels = { pending: "PROPOSED", applied: "APPLIED", reverted: "REVERTED" };
    return `
      <section class="diff-panel" data-diff-id="${esc(diffId)}" data-state="${stateName}" aria-label="Diff preview">
        <div class="diff-head">
          <span class="diff-type">PATCH</span>
          <span class="diff-file">${esc(diff.file)}</span>
          <span class="diff-count"><span class="add">+${diff.add}</span><span class="del">−${diff.del}</span></span>
          <span class="diff-hunk">${esc(diff.hunk)}</span>
          <span class="diff-state">${stateLabels[stateName] || "PROPOSED"}</span>
        </div>
        <div class="diff-body">
          ${diff.lines.map((line) => `
            <div class="diff-line ${line.type}">
              <span class="ln">${String(line.n).padStart(4, "0")}</span>
              <span class="sign">${line.type === "add" ? "+" : line.type === "rem" ? "-" : " "}</span>
              <span class="code">${esc(line.code)}</span>
            </div>`).join("")}
        </div>
        <div class="diff-foot">
          <span>1 hunk · ${diff.lines.length} lines shown</span>
          <span class="accent">atomic write · review required</span>
        </div>
      </section>`;
  }

  function approvalMarkup(pending) {
    return `
      <div class="approval-bar" data-approval-id="${esc(pending.approvalId)}">
        <div class="approval-signal" aria-hidden="true">!</div>
        <div class="approval-copy">
          <span class="approval-title">APPROVAL REQUIRED</span>
          <span class="approval-file">patch <b>${esc(pending.file)}</b> <span class="muted">· +${pending.add} −${pending.del}</span></span>

        <div class="approval-actions">
          <button class="btn" type="button" data-action="reject">REJECT <kbd>D</kbd></button>
          <button class="btn approve" type="button" data-action="approve">APPROVE <kbd>A</kbd></button>
        </div>
      </div>`;
  }

  function seedMarkup() {
    return `
      <div class="system-row">
        <span class="sig" aria-hidden="true">⌁</span>
        <span class="sys-strong">session resumed</span>
        <span class="sys-sep">/</span>
        <span>branch feat/command-palette</span>
        <span class="sys-sep sys-base-sep">/</span>
        <span class="sys-base">base 082f08a</span>
        <span class="sys-right">T+ 04:12</span>
      </div>
      <article class="turn turn-user">
        <div class="turn-head">
          <span class="speaker"><span class="speaker-mark" aria-hidden="true">❯</span>YOU</span>
          <span class="turn-time">18:42:07</span>
          <span class="turn-route">BUILD</span>
        </div>
        <p class="user-copy">给设置页加一个 <code>⌘K</code> 命令面板，复用现有 command registry；<code>/</code> 补全也要能键盘操作。先只改 TUI 层，别动 SDK。</p>
      </article>
      <article class="turn turn-agent">
        <div class="turn-head">
          <span class="speaker agent"><span class="agent-sigil" aria-hidden="true"></span>NULO</span>
          <span class="turn-time">18:42:11</span>
          <span class="turn-route">build · step 03</span>
        </div>
        <button class="reasoning-toggle" type="button" aria-expanded="false">
          <span class="reasoning-chevron" aria-hidden="true">›</span>
          <span class="reasoning-label">THOUGHT</span>
          <span class="reasoning-time">3 steps · 3.2s</span>
          <span class="reasoning-rule" aria-hidden="true"></span>
        </button>
        <div class="reasoning-body" hidden>

            <div class="tool-row">
              <span class="tool-kind">read</span>

  }

  function emptyMarkup() {
    return `
