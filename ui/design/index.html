          <span class="push">⌘K to open commands</span>
        </div>
      </section>`;
  }

  function renderInitial() {
    el.feedInner.innerHTML = seedMarkup();
    renderRail();
    setStatus("awaiting", "AWAITING", "patch review");
    renderContext();
    updateComposer();
    feedStick = true;
  }

  function appendUserTurn(text) {
    const empty = el.feedInner.querySelector(".empty");
    if (empty) empty.remove();
    if (state.session === "new-session") setSessionName(sessionNameFor(text));
    const node = document.createElement("article");
    node.className = "turn turn-user";
    node.innerHTML = `
      <div class="turn-head">
        <span class="speaker"><span class="speaker-mark" aria-hidden="true">❯</span>YOU</span>
        <span class="turn-time">${clock()}</span>
        <span class="turn-route">${state.mode.toUpperCase()}</span>
      </div>
      <p class="user-copy">${richText(text)}</p>`;
    el.feedInner.appendChild(node);
    scrollFeed();
    return node;
  }

  function appendAgentShell(route = null) {
    const node = document.createElement("article");
    node.className = "turn turn-agent";
    node.innerHTML = `
      <div class="turn-head">
        <span class="speaker agent"><span class="agent-sigil" aria-hidden="true"></span>NULO</span>
        <span class="turn-time">${clock()}</span>
        <span class="turn-route">${esc(route || `${state.mode} · live`)}</span>
      </div>
      <button class="reasoning-toggle" type="button" aria-expanded="false">
        <span class="reasoning-chevron" aria-hidden="true">›</span>
        <span class="reasoning-label">THOUGHT</span>
        <span class="reasoning-time"><span class="thinking-label"><span class="thinking-dot" aria-hidden="true"></span>tracing</span></span>
        <span class="reasoning-rule" aria-hidden="true"></span>
      </button>
      <div class="reasoning-body" hidden></div>
      <p class="agent-copy"><span class="cursor" aria-hidden="true"></span></p>
      <div class="agent-extras"></div>`;
    el.feedInner.appendChild(node);
    return {
      node,
      toggle: $(".reasoning-toggle", node),
      reasoning: $(".reasoning-body", node),
      copy: $(".agent-copy", node),
      extras: $(".agent-extras", node),
    };
  }

  function fillReasoning(shell, steps, time) {
    shell.toggle.querySelector(".reasoning-time").textContent = time;
    shell.reasoning.innerHTML = steps
      .map((step, index) => `<div class="reasoning-step"><span>${pad(index + 1)}</span><p>${esc(step)}</p></div>`)
      .join("");
  }

  async function typeText(node, text, token, finalHtml = null) {
    const chars = Array.from(text);
    let index = 0;
    const cursor = '<span class="cursor" aria-hidden="true"></span>';
    node.innerHTML = cursor;
    while (index < chars.length) {
      if (token !== state.runSeq) return false;
      index += 2 + Math.floor(Math.random() * 3);
      node.innerHTML = esc(chars.slice(0, index).join("")) + cursor;
      scrollFeed();
      await sleep(17);
    }
    node.innerHTML = finalHtml || esc(text);
    scrollFeed();
    return true;
  }

  function createToolSection(host) {
    const section = document.createElement("div");
    section.className = "tool-section";
    section.innerHTML = `
      <div class="tool-section-head">
        <span class="tool-pulse" aria-hidden="true"></span>
        <span>TOOL ACTIVITY</span>
        <span class="tool-count">0 calls</span>
      </div>
      <div class="tool-list"></div>`;
    host.appendChild(section);
    return section;
  }

  function nextToolCount(section) {
    const count = section.querySelectorAll(".tool-row").length;
    section.querySelector(".tool-count").textContent = `${count} call${count === 1 ? "" : "s"}`;
  }

  function addToolCall(section, type, command, status = "running") {
    const row = document.createElement("div");
    row.className = `tool-row ${status === "running" ? "is-running" : ""} ${status === "review" ? "is-review" : ""}`;
    row.innerHTML = `
      <span class="tool-kind">${esc(type)}</span>
      <span class="tool-cmd">${esc(command)}</span>
      <span class="tool-state">${status === "running" ? '<span class="tool-spinner" aria-hidden="true"></span>' : status === "review" ? "review" : status}</span>
      <span class="tool-time">—</span>`;
    section.querySelector(".tool-list").appendChild(row);
    nextToolCount(section);
    scrollFeed();
    return row;
  }

  function completeToolCall(row, time, detail = "", stateLabel = "ok") {
    row.classList.remove("is-running");
    row.classList.add("is-done");
    row.querySelector(".tool-state").innerHTML = esc(stateLabel);
    row.querySelector(".tool-time").textContent = time;
    if (detail) {
      const detailRow = document.createElement("div");
      detailRow.className = "tool-detail";
      detailRow.innerHTML = `<span class="tree">└</span>${esc(detail)}`;
      row.insertAdjacentElement("afterend", detailRow);
    }
    scrollFeed();
  }

  function appendDiff(shell, diff, diffId) {
    const wrap = document.createElement("div");
    wrap.className = "patch-wrap";
    wrap.innerHTML = diffMarkup(diff, "pending", diffId);
    shell.extras.appendChild(wrap);
    scrollFeed();
    return wrap;
  }

  function appendApproval(wrap, pending) {
    wrap.insertAdjacentHTML("beforeend", approvalMarkup(pending));
    scrollFeed();
  }

  function activePlanTip() {
    const active = state.plan.find((item) => item.state === "active");
    return active ? active.title : "";
  }

  function updateActivePlanNote(note) {
    const active = state.plan.find((item) => item.state === "active");
    if (active) active.note = note;
  }

  function keywordFor(text) {
    if (/clear|状态|reset/i.test(text)) return "clear|reset|close";
    if (/test|测试|回归/i.test(text)) return "TestPalette|KeyMap";
    if (/设置|settings/i.test(text)) return "settings|command|shortcut";
    return "palette|command|keymap";
  }

  function makeObjective(text) {
    const clean = text.replace(/\s+/g, " ").trim();
    return clean.length > 46 ? `${clean.slice(0, 46)}…` : clean;
  }

  function makeBuildPlan() {
    return [
      { title: "扫描相关入口与调用点", state: "active", note: "read-only" },
      { title: "确认最小改动面", state: "pending" },
      { title: "生成补丁并等待批准", state: "pending" },
      { title: "验证结果并总结", state: "pending" },
    ];
  }

  function sessionNameFor(text) {
    if (/⌘K|palette|命令面板/i.test(text)) return "command-palette";
    if (/test|测试|回归|keyboard/i.test(text)) return "keyboard-regression";
    if (/clear|状态|重置/i.test(text)) return "clear-path";
    return "workspace-task";
  }

  function setSessionName(name) {
    state.session = name;
    el.sessionName.textContent = name;
    el.sessionName.parentElement.title = name;
  }

  function makePlanModePlan() {
    return [
      { title: "在 keymap.go 增加 ⌘K / 方向键前置分支", state: "pending", note: "1 file" },
      { title: "复用 palette.filter 实现 / 与 @ 补全", state: "pending", note: "shared state" },
      { title: "补齐 esc / tab 焦点回归测试", state: "pending", note: "2 cases" },
      { title: "运行 go test ./internal/tui 并审阅 diff", state: "pending", note: "gate" },
    ];
  }

  async function startBuild(text, options = {}) {
    if (state.running) {
      showToast("The current run is still active.", { tone: "muted", mark: "!" });
      return;
    }
    if (state.awaiting) {
      showToast("Resolve the pending patch before starting a new request.", { mark: "!" });
      scrollToLatestDiff(true);
      return;
    }

    const token = ++state.runSeq;
    clearToasts();
    state.running = true;
    state.awaiting = false;
    state.completed = false;
    state.failed = false;
    state.planReady = false;
    state.pending = null;
    state.lastUserText = text;
    state.plan = makeBuildPlan();
    state.objective = makeObjective(text);
    const keyword = keywordFor(text);
    setStatus("running", "WORKING", "streaming");
    updateComposer();
    renderRail();
    if (options.echoUser !== false) appendUserTurn(text);
    else appendSystemEvent("Plan accepted · switching to <strong>BUILD</strong>");

    await sleep(360);
    if (token !== state.runSeq) return;

    const shell = appendAgentShell("build · live");
    state.activeAgent = shell;
    scrollFeed(true);
    await sleep(460);
    if (token !== state.runSeq) return;

    fillReasoning(shell, [
      "解析请求，检索相关入口与调用点，先不改动工作区。",
      "确认共享状态边界，尽量复用现有 command registry。",
      "写入前挂起，等待人工确认这个补丁。",
    ], "3 steps · 1.6s");

    const firstCopy = "收到。我先只读扫描相关入口，确认调用点与影响面，再收敛成一处最小改动。写入前会停下来请求批准。";
    if (!(await typeText(shell.copy, firstCopy, token))) return;
    addContext(0.4);

    const tools = createToolSection(shell.extras);
    const shellRow = addToolCall(tools, "shell", `rg -n "${keyword}" internal/tui`);
    await sleep(620);
    if (token !== state.runSeq) return;
    completeToolCall(shellRow, "0.08s", "4 files · 21 matches");
    state.plan[0].state = "done";
    state.plan[0].note = "4 files · 21 matches";
    state.plan[1].state = "active";
    updateActivePlanNote("checking call sites");
    addContext(0.3);
    renderRail();

    const readRow = addToolCall(tools, "read", "internal/tui/keymap.go");
    await sleep(520);
    if (token !== state.runSeq) return;
    completeToolCall(readRow, "0.03s", "184 lines · 12 key paths");
    state.plan[1].state = "done";
    state.plan[1].note = "minimal diff surface";
    state.plan[2].state = "active";
    updateActivePlanNote("preparing patch");
    renderRail();
    scrollFeed();

    const secondCopy = "影响面比预期小：现有 registry 可以原样复用，只需在按键分发前增加 palette 前置分支。补丁已就绪，等待你确认。";
    const copyNode = document.createElement("p");
    copyNode.className = "agent-copy";
    shell.extras.appendChild(copyNode);
    if (!(await typeText(copyNode, secondCopy, token))) return;
    addContext(0.8);

    const editRow = addToolCall(tools, "edit", "internal/tui/keymap.go");
    completeToolCall(editRow, "0.02s", "", "waiting");
    editRow.classList.add("is-review");
    editRow.classList.remove("is-done");
    editRow.querySelector(".tool-state").textContent = "review";
    editRow.querySelector(".tool-time").textContent = "hold";

    const diffId = `diff-${token}`;
    const approvalId = `approval-${token}`;
    const wrap = appendDiff(shell, KEYMAP_DIFF, diffId);
    state.pending = {
      file: KEYMAP_DIFF.file,
      add: KEYMAP_DIFF.add,
      del: KEYMAP_DIFF.del,
      diffId,
      approvalId,
    };
    state.lastDiffId = diffId;
    appendApproval(wrap, state.pending);
    state.files = state.files.filter((file) => !file.pending && file.path !== KEYMAP_DIFF.file);
    state.files.push({ path: KEYMAP_DIFF.file, state: "M", add: KEYMAP_DIFF.add, del: KEYMAP_DIFF.del, pending: true });
    state.running = false;
    state.awaiting = true;
    updateActivePlanNote("awaiting approval");
    setStatus("awaiting", "AWAITING", "patch review");
    renderRail();
    updateComposer();
    scrollFeed();
    showToast("Patch ready for review.", { mark: "!" });
  }

  async function startPlan(text) {
    if (state.running) {
      showToast("The current run is still active.", { tone: "muted", mark: "!" });
      return;
    }
    if (state.awaiting) {
      showToast("Resolve the pending patch before starting a plan.", { mark: "!" });
      scrollToLatestDiff(true);
      return;
    }
    const token = ++state.runSeq;
    clearToasts();
    state.running = true;
    state.completed = false;
    state.failed = false;
    state.awaiting = false;
    state.pending = null;
    state.planReady = false;
    state.lastPlanText = text;
    state.lastUserText = text;
    state.objective = makeObjective(text);
    state.plan = makePlanModePlan();
    setStatus("running", "WORKING", "planning");
    updateComposer();
    renderRail();
    appendUserTurn(text);

    await sleep(320);
    if (token !== state.runSeq) return;
    const shell = appendAgentShell("plan · read-only");
    state.activeAgent = shell;
    await sleep(480);
    if (token !== state.runSeq) return;
    fillReasoning(shell, [
      "读取相关实现与测试，不进行任何写入。",
      "把改动拆成可验证的最小步骤，标出文件与验证闸门。",
      "等待切换到 Build 模式后再申请批准。",
    ], "3 steps · 1.2s");
    if (!(await typeText(shell.copy, "先不改文件。我会把路径拆成四步，标出每个验证点；确认后再切到 Build 执行。", token))) return;

    const tools = createToolSection(shell.extras);
    const shellRow = addToolCall(tools, "shell", `rg -n "palette|keymap|tab" internal/tui`);
    await sleep(520);
    if (token !== state.runSeq) return;
    completeToolCall(shellRow, "0.06s", "3 files · 18 matches");
    addContext(0.6);

    const readRow = addToolCall(tools, "read", "internal/tui/command_palette.go");
    await sleep(420);
    if (token !== state.runSeq) return;
    completeToolCall(readRow, "0.02s", "86 lines · state + key paths");
    addContext(0.5);

    const preview = document.createElement("section");
    preview.className = "plan-preview";
    const labels = ["keymap.go", "palette state", "tests", "go test"];
    preview.innerHTML = `
      <div class="plan-preview-head">
        <span>PROPOSED PLAN</span>
        <span class="plan-preview-meta">4 steps · 1 approval · no writes</span>
      </div>
      <div class="plan-preview-list">
        ${state.plan.map((item, index) => `
          <div class="plan-preview-step">
            <span>${pad(index + 1)}</span>
            <span>${esc(item.title)}</span>
            <em>${esc(labels[index])}</em>
          </div>`).join("")}
      </div>
      <div class="plan-preview-foot">
        <span>Read-only. Writes stay locked until you switch to Build.</span>
        <button class="btn approve" type="button" data-action="execute-plan">RUN IN BUILD <kbd>B</kbd></button>
      </div>`;
    shell.extras.appendChild(preview);
    state.running = false;
    state.planReady = true;
    state.plan = state.plan.map((item) => ({ ...item, note: item.note || "not started" }));
    setStatus("plan", "PLAN READY", "no files changed");
    renderRail();
    updateComposer();
    addContext(0.4);
    scrollFeed(true);
    showToast("Plan ready · switch to Build to execute.", { mark: "□" });
  }

  async function executePlan() {
    if (state.running) return;
    if (!state.lastPlanText) return;
    const text = state.lastPlanText;
    document.querySelectorAll('[data-action="execute-plan"]').forEach((button) => {
      button.disabled = true;
      button.textContent = "QUEUED";
    });
    setMode("build", { quiet: true });
    await startBuild(text, { echoUser: false });
  }

  function findDiff(diffId) {
    return document.querySelector(`.diff-panel[data-diff-id="${CSS.escape(diffId)}"]`);
  }

  function scrollToLatestDiff(forceFlash = false) {
    const diff = findDiff(state.lastDiffId) || Array.from(document.querySelectorAll(".diff-panel")).pop();
    if (!diff) {
      showToast("No patch in this session.", { tone: "muted", mark: "—" });
      return;
    }
    diff.scrollIntoView({ behavior: "smooth", block: "center" });
    diff.classList.remove("flash");
    void diff.offsetWidth;
    if (forceFlash || true) diff.classList.add("flash");
    window.setTimeout(() => diff.classList.remove("flash"), 1250);
  }

  function markDiffState(diff, status) {
    if (!diff) return;
    diff.dataset.state = status;
    const label = diff.querySelector(".diff-state");
    if (label) label.textContent = status === "applied" ? "APPLIED" : status === "reverted" ? "REVERTED" : "PROPOSED";
  }

  async function approvePending() {
    if (!state.pending || state.running) {
      showToast("There is no pending patch to approve.", { tone: "muted", mark: "—" });
      return;
    }
    const token = ++state.runSeq;
    const pending = state.pending;
    const diff = findDiff(pending.diffId);
    const wrap = diff ? diff.parentElement : null;
    state.pending = null;
    state.awaiting = false;
    state.running = true;
    state.failed = false;
    state.completed = false;
    markDiffState(diff, "applied");
    document.querySelectorAll(`[data-approval-id="${CSS.escape(pending.approvalId)}"]`).forEach((node) => node.remove());
    if (wrap) {
      wrap.insertAdjacentHTML("beforeend", `
        <div class="patch-outcome">
          <span class="ok" aria-hidden="true">✓</span>
          <span class="out-label">PATCH APPLIED</span>
          <span class="out-meta">${esc(pending.file)} · written atomically</span>
          <span class="out-time">00:01.2</span>
        </div>`);
    }
    state.files = state.files.map((file) => file.pending ? { ...file, pending: false } : file);
    state.plan = state.plan.map((item) => {
      if (item.state === "active") return { ...item, state: "done", note: "patch applied" };
      if (item.title.toLowerCase().includes("回归") || item.title.includes("验证") || item.title.includes("复跑")) {
        return { ...item, state: "active", note: "running verification" };
      }
      return item;
    });
    addContext(0.9);
    setStatus("running", "WORKING", "verifying patch");
    renderRail();
    updateComposer();
    scrollFeed(true);
    showToast("Patch applied · verification started.", { mark: "✓" });

    const host = state.activeAgent && document.body.contains(state.activeAgent.node)
      ? state.activeAgent.extras
      : ($(".agent-turn:last-of-type .agent-extras") || el.feedInner);
    const verify = createToolSection(host);
    const testRow = addToolCall(verify, "shell", "go test ./internal/tui -run 'TestPalette|TestKeyMap'");
    scrollFeed();
    await sleep(880);
    if (token !== state.runSeq) return;
    completeToolCall(testRow, "0.61s", "12 passed · 0 failed");
    addContext(1.1);
    state.plan = state.plan.map((item) => item.state === "active" ? { ...item, state: "done", note: "12 passed" } : item);
    if (state.plan.some((item) => item.state === "pending")) {
      state.plan = state.plan.map((item) => item.state === "pending" ? { ...item, state: "done", note: "verified" } : item);
    }
    const completion = document.createElement("section");
    completion.className = "completion";
    completion.innerHTML = `
      <div class="completion-head">
        <span class="check" aria-hidden="true">✓</span>
        <span>BUILD COMPLETE</span>
        <span class="completion-rule" aria-hidden="true"></span>
        <span class="duration">00:06.4</span>
      </div>
      <p>⌘K 面板已经接入同一份 command registry。方向键移动、Tab 补全、Esc 关闭与 / 前缀共享过滤状态；所有写入都经过人工批准。</p>

  function rejectPending() {
    if (!state.pending || state.running) {
      showToast("There is no pending patch to reject.", { tone: "muted", mark: "—" });
      return;
    }
    const pending = state.pending;
    const diff = findDiff(pending.diffId);
    const wrap = diff ? diff.parentElement : null;
    state.pending = null;
    state.awaiting = false;
    state.failed = false;
    state.completed = false;
    markDiffState(diff, "reverted");
    document.querySelectorAll(`[data-approval-id="${CSS.escape(pending.approvalId)}"]`).forEach((node) => node.remove());
    if (wrap) {
      wrap.insertAdjacentHTML("beforeend", `
        <div class="patch-outcome reverted">
          <span class="out-label">↩ PATCH REJECTED</span>
          <span class="out-meta">workspace restored · 0 bytes written</span>
          <span class="out-time">rolled back</span>
        </div>`);
    }
    state.files = state.files.filter((file) => !file.pending);
    state.plan = state.plan.map((item) => {
      if (item.state === "active") return { ...item, state: "pending", note: "reverted · no changes" };
      return item;
    });
    setStatus("ready", "READY", "awaiting input");
    renderRail();
    updateComposer();
    const host = state.activeAgent && document.body.contains(state.activeAgent.node)
      ? state.activeAgent.extras
      : ($(".agent-turn:last-of-type .agent-extras") || el.feedInner);
    host.insertAdjacentHTML("beforeend", `<p class="agent-followup">已回滚，工作区没有写入。需要我换一种实现再试吗？</p>`);
    scrollFeed(true);
    showToast("Patch rejected · workspace restored.", { tone: "muted", mark: "↩" });
  }

  function executeSlash(raw) {
    const [command] = raw.trim().split(/\s+/);
    const normalized = (command || "").toLowerCase();
    el.input.value = "";
    autosizeInput();
    closeCompletion();
    updateComposer();
    switch (normalized) {
      case "/plan":
        setMode("plan");
        scrollFeed(true);
        break;
      case "/diff":
        scrollToLatestDiff(true);
        break;
      case "/approve":
        approvePending();
        break;
      case "/clear":
        clearSession();
        break;
      default:
        showToast(`Unknown command: ${command}`, { tone: "muted", mark: "?" });
    }
  }

  function handleSubmit() {
    const raw = el.input.value;
    const text = raw.trim();
    if (!text) return;
    if (text.startsWith("/")) {
      executeSlash(text);
      return;
    }
    if (state.running) {
      showToast("Wait for the current run to finish.", { tone: "muted", mark: "!" });
      return;
    }
    if (state.awaiting) {
      showToast("Resolve the pending patch first · A approve / D reject.", { mark: "!" });
      scrollToLatestDiff(true);
      return;
    }
    el.input.value = "";
    autosizeInput();
    closeCompletion();
    updateComposer();
    if (state.mode === "plan") startPlan(text);
    else startBuild(text);
  }

  function autosizeInput() {
    el.input.style.height = "auto";
    el.input.style.height = `${Math.min(el.input.scrollHeight, 146)}px`;
  }

  /* ── inline slash / mention completion ─────────────────────────────── */
  function updateCompletion() {
    const value = el.input.value;
    const caret = el.input.selectionStart ?? value.length;
    if (caret !== value.length) {
      closeCompletion();
      return;
    }
    const before = value.slice(0, caret);
    const slashMatch = /^\/([a-zA-Z]*)$/.exec(before);
    const mentionMatch = /(^|[\s])@([\w./-]*)$/.exec(before);
    if (slashMatch) {
      const query = slashMatch[1].toLowerCase();
      completion.items = slashCommands.filter((item) => item.command.slice(1).startsWith(query));
      completion.mode = "slash";
    } else if (mentionMatch) {
      const query = mentionMatch[2].toLowerCase();
      completion.items = MENTION_FILES
        .filter((path) => path.toLowerCase().includes(query))
        .map((path) => ({ path }));
      completion.mode = "mention";
      completion.start = mentionMatch.index + mentionMatch[1].length;
      completion.end = caret;
    } else {
      closeCompletion();
      return;
    }
    completion.query = slashMatch ? slashMatch[1] : mentionMatch[2];
    if (!completion.items.length) {
      closeCompletion();
      return;
    }
    completion.open = true;
    completion.index = Math.min(completion.index, completion.items.length - 1);
    if (completion.index < 0) completion.index = 0;
    completion.start = completion.mode === "slash" ? 0 : completion.start;
    completion.end = caret;
    renderCompletion();
  }

  function renderCompletion() {
    const mode = completion.mode;
    const title = mode === "slash" ? "COMMANDS" : "MENTION FILE";
    const hint = `<span><kbd>↑</kbd><kbd>↓</kbd></span><span>tab complete</span><span>esc close</span>`;
    const rows = completion.items.map((item, index) => {
      if (mode === "slash") {
        return `
          <button class="completion-item ${index === completion.index ? "is-active" : ""}" type="button" data-completion-index="${index}" role="option" aria-selected="${index === completion.index}">
            <span class="ci-mark" aria-hidden="true">/</span>
            <span class="ci-main"><span class="ci-title">${esc(item.command)}</span><span class="ci-desc">${esc(item.desc)}</span></span>
            <span class="ci-key">${esc(item.key)}</span>
          </button>`;
      }
      return `
        <button class="completion-item ${index === completion.index ? "is-active" : ""}" type="button" data-completion-index="${index}" role="option" aria-selected="${index === completion.index}">
          <span class="ci-mark" aria-hidden="true">@</span>
          <span class="ci-main"><span class="ci-title">${esc(item.path)}</span><span class="ci-desc">include as context</span></span>
          <span class="ci-key">↵</span>
        </button>`;
    }).join("");
    el.completionPop.hidden = false;
    el.completionPop.innerHTML = `
      <div class="completion-head">
        <span><strong>${title}</strong> · ${completion.items.length}</span>
        <span class="completion-hint">${hint}</span>
      </div>
      <div class="completion-items" role="listbox">${rows}</div>
      <div class="completion-foot">
        <span>${mode === "slash" ? "/ commands share the palette registry" : "@ inserts a workspace path"}</span>
        <span class="accent">${mode === "slash" ? "enter run" : "enter insert"}</span>
      </div>`;
  }

  function closeCompletion() {
    completion.open = false;
    completion.mode = null;
    completion.items = [];
    completion.index = 0;
    el.completionPop.hidden = true;
    el.completionPop.innerHTML = "";
  }

  function completeOrRunSelected(execute = false) {
    if (!completion.open || !completion.items.length) return false;
    const item = completion.items[completion.index];
    if (completion.mode === "slash") {
      if (execute) {
        closeCompletion();
        executeSlash(item.command);
      } else {
        el.input.value = `${item.command} `;
        el.input.setSelectionRange(el.input.value.length, el.input.value.length);
        closeCompletion();
        updateComposer();
      }
    } else {
      const path = item.path;
      const value = el.input.value;
      const before = value.slice(0, completion.start);
      const after = value.slice(completion.end);
      el.input.value = `${before}@${path} ${after}`.replace(/\s+$/, " ");
      const caret = before.length + path.length + 2;
      el.input.setSelectionRange(caret, caret);
      closeCompletion();
      updateComposer();
      autosizeInput();
    }
    return true;
  }

  function renderPalette() {
    const query = el.paletteInput.value.trim().toLowerCase();
    paletteItems = paletteActions().filter((action) => {
      if (!query) return true;
      return `${action.label} ${action.desc} ${action.group}`.toLowerCase().includes(query);
    });
    paletteSelected = Math.min(paletteSelected, Math.max(0, paletteItems.length - 1));
    el.paletteCount.textContent = `${paletteItems.length} action${paletteItems.length === 1 ? "" : "s"}`;
    if (!paletteItems.length) {
      el.paletteList.innerHTML = `<div class="palette-no-results">No command matches <b>“${esc(el.paletteInput.value)}”</b>.<br><br>Try “plan”, “diff”, or “clear”.</div>`;
      return;
    }
    let previousGroup = "";
    el.paletteList.innerHTML = paletteItems.map((action, index) => {
      const group = action.group !== previousGroup
        ? `<div class="palette-group">${esc(action.group)}</div>`
        : "";
      previousGroup = action.group;
      return `${group}
        <button class="palette-item ${index === paletteSelected ? "is-selected" : ""}" type="button" data-palette-id="${esc(action.id)}" role="option" aria-selected="${index === paletteSelected}">
          <span class="palette-glyph" aria-hidden="true">${esc(action.glyph)}</span>
          <span class="palette-item-main">
            <span class="palette-item-label">${esc(action.label)}</span>
            <span class="palette-item-desc">${esc(action.desc)}</span>
          </span>
          <span class="palette-item-key">${esc(action.key)}</span>
        </button>`;
    }).join("");
    requestAnimationFrame(() => {
      const selected = el.paletteList.querySelector(".palette-item.is-selected");
      if (selected) selected.scrollIntoView({ block: "nearest" });
    });
  }

  function openPalette() {
    closeCompletion();
    paletteReturnFocus = document.activeElement;
    el.paletteOverlay.hidden = false;
    el.paletteInput.value = "";
    paletteSelected = state.pending ? paletteActions().findIndex((action) => action.id === "review") : 0;
    if (paletteSelected < 0) paletteSelected = 0;
    renderPalette();
    $(".palette-mode", el.paletteOverlay).textContent = state.mode.toUpperCase();
    requestAnimationFrame(() => el.paletteInput.focus());

  function closePalette(restore = true) {
    if (el.paletteOverlay.hidden) return;
    el.paletteOverlay.hidden = true;
    if (restore && paletteReturnFocus && document.contains(paletteReturnFocus)) {
      try { paletteReturnFocus.focus({ preventScroll: true }); } catch { el.input.focus(); }
    }

  /* ── events ─────────────────────────────────────────────────────────── */
  el.feed.addEventListener("scroll", () => {
    const distance = el.feed.scrollHeight - el.feed.scrollTop - el.feed.clientHeight;
    feedStick = distance < 110;
  });

  el.input.addEventListener("input", () => {
    autosizeInput();
    updateComposer();
    updateCompletion();
  });

  el.input.addEventListener("keydown", (event) => {
    if (event.isComposing || event.keyCode === 229) return;
    if (completion.open) {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        completion.index = (completion.index + 1) % completion.items.length;
        renderCompletion();
        return;
      }
      if (event.key === "ArrowUp") {
        event.preventDefault();
        completion.index = (completion.index - 1 + completion.items.length) % completion.items.length;
        renderCompletion();
        return;
      }
      if (event.key === "Tab") {
        event.preventDefault();
        completeOrRunSelected(false);
        return;
      }
      if (event.key === "Escape") {
        event.preventDefault();
        closeCompletion();
        return;
      }
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        completeOrRunSelected(true);
        return;
      }
    }
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      handleSubmit();
    }
  });

  el.send.addEventListener("click", handleSubmit);

  $$(".mode-btn").forEach((button) => {
    button.addEventListener("click", () => setMode(button.dataset.mode));
  });

  document.addEventListener("click", (event) => {
    if (completion.open && !event.target.closest("#completionPop") && event.target !== el.input && !event.target.closest(".mode-btn")) {
      closeCompletion();
    }

    const completionItem = event.target.closest("[data-completion-index]");
    if (completionItem) {
      completion.index = Number(completionItem.dataset.completionIndex);
      completeOrRunSelected(true);
      el.input.focus();
      return;
    }

    const actionTarget = event.target.closest("[data-action]");
    if (actionTarget) {
      const action = actionTarget.dataset.action;
      if (action === "approve") approvePending();
      else if (action === "reject") rejectPending();
      else if (action === "scroll-diff") scrollToLatestDiff(true);
      else if (action === "execute-plan") executePlan();
      else if (action === "close-drawer") closeDrawer();
      else if (action === "retry-failure") retryFailureDemo();
      return;
    }

    const reasoning = event.target.closest(".reasoning-toggle");
    if (reasoning) {
      toggleReasoning(reasoning);
      return;
    }

    const suggestion = event.target.closest("[data-suggestion]");
    if (suggestion) {
      el.input.value = suggestion.dataset.suggestion;
      autosizeInput();
      updateComposer();
      handleSubmit();
      return;
    }

    const paletteItem = event.target.closest("[data-palette-id]");
    if (paletteItem) {
      const index = paletteItems.findIndex((item) => item.id === paletteItem.dataset.paletteId);
      if (index >= 0) choosePalette(index);
      return;
    }

    if (event.target === el.paletteOverlay) closePalette();
    if (event.target === el.drawerScrim) closeDrawer();
  });

  document.addEventListener("mousemove", (event) => {
    const completionItem = event.target.closest("[data-completion-index]");
    if (completionItem && completion.open) {
      const index = Number(completionItem.dataset.completionIndex);
      if (index !== completion.index) {
        completion.index = index;
        renderCompletion();
      }
    }
    const paletteItem = event.target.closest("[data-palette-id]");
    if (paletteItem && !el.paletteOverlay.hidden) {
      const index = paletteItems.findIndex((item) => item.id === paletteItem.dataset.paletteId);
      if (index >= 0 && index !== paletteSelected) {
        paletteSelected = index;
        $$(".palette-item", el.paletteList).forEach((node, nodeIndex) => {
          node.classList.toggle("is-selected", nodeIndex === index);
          node.setAttribute("aria-selected", nodeIndex === index ? "true" : "false");
        });
      }
    }
  });

  el.paletteInput.addEventListener("input", () => {
    paletteSelected = 0;
    renderPalette();
  });

  el.paletteInput.addEventListener("keydown", (event) => {
    if (event.key === "ArrowDown") {
      event.preventDefault();
      if (!paletteItems.length) return;
      paletteSelected = (paletteSelected + 1) % paletteItems.length;
      renderPalette();
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      if (!paletteItems.length) return;
      paletteSelected = (paletteSelected - 1 + paletteItems.length) % paletteItems.length;
      renderPalette();
    } else if (event.key === "Enter") {
      event.preventDefault();
      choosePalette(paletteSelected);
    } else if (event.key === "Escape") {
      event.preventDefault();
      closePalette();
    }
  });

  el.paletteBtn.addEventListener("click", openPalette);
  el.paletteClose.addEventListener("click", () => closePalette());
  el.drawerBtn.addEventListener("click", () => {
    if (document.body.classList.contains("drawer-open")) closeDrawer();
    else openDrawer();
  });

  el.drawerScrim.addEventListener("click", closeDrawer);

  document.addEventListener("keydown", (event) => {
    const mod = event.metaKey || event.ctrlKey;
    if (mod && event.key.toLowerCase() === "k") {
      event.preventDefault();
      if (el.paletteOverlay.hidden) openPalette();
      else closePalette();
      return;
    }
    if (event.key === "Escape") {
      if (!el.paletteOverlay.hidden) {
        closePalette();
        return;
      }
      if (completion.open) {
        closeCompletion();
        return;
      }
      if (document.body.classList.contains("drawer-open")) {
        closeDrawer();
        return;
      }
    }
    const editable = event.target.closest("input, textarea, [contenteditable='true']") || !el.paletteOverlay.hidden;
    if (!editable && !state.running && state.awaiting && !event.metaKey && !event.ctrlKey && !event.altKey) {
      if (event.key.toLowerCase() === "a") {
        event.preventDefault();
        approvePending();
      } else if (event.key.toLowerCase() === "d") {
        event.preventDefault();
        rejectPending();
      }
    }
  });

  window.addEventListener("resize", () => {
    if (window.innerWidth > 980) closeDrawer();
  });

  // Seed the prototype in a credible paused state.
  renderInitial();
  autosizeInput();

  // A subtle live clock keeps the session status honest without changing layout.
  window.setInterval(() => {
    if (!state.running) return;
    const mins = Math.floor((Date.now() - state.startedAt) / 60000);
    if (mins > 0) state.startedAt = state.startedAt;
  }, 60000);
})();
</script>
</body>
</html>
