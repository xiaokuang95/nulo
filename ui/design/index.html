<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>nulo — 100×30 TUI</title>
<style>
  :root {
    --bg: #060807;
    --panel: #0a0d0b;
    --ink: #d6ddcf;
    --soft: #a8b3a2;
    --muted: #768271;
    --faint: #4d584a;
    --line: #1a211b;
    --accent: #b7e08b;
    --accent-dim: #7da35e;
    --warn: #e5c07b;
    --bad: #d27e7e;
    --mono: "Cascadia Mono", "Sarasa Mono SC", "Noto Sans Mono CJK SC",
            "SFMono-Regular", "SF Mono", Menlo, Monaco, Consolas, monospace;
    --fs: clamp(9px, min(1.42vw, 2.55vh), 21px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: var(--fs);
    line-height: 1.2;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    padding: 16px;
    position: relative;
  }

  .screen {
    width: 100ch;
    height: 30lh;
    max-width: calc(100vw - 32px);
    overflow: hidden;
    white-space: pre;
    cursor: text;
    outline: none;
    user-select: text;
  }

  .row {
    height: 1lh;
    overflow: hidden;
    white-space: pre;
  }

  .capture {
    position: absolute;
    left: 50%;
    bottom: 2px;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    pointer-events: none;
    transform: translateX(-50%);
  }

  .bold { font-weight: 700; }
  .accent { color: var(--accent); }
  .accent-dim { color: var(--accent-dim); }
  .ink { color: var(--ink); }
  .soft { color: var(--soft); }
  .muted { color: var(--muted); }
  .dim { color: var(--muted); }
  .faint { color: var(--faint); }
  .rule { color: var(--line); }
  .kind { color: var(--faint); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
  .add { color: var(--accent); }
  .del { color: var(--bad); }
  .rem { color: #b18b8b; }
  .ctx { color: #8b9784; }
  .ln { color: #465143; }
  .hunk { color: var(--accent-dim); }
  .underlay { color: #2c352a; }
  .panel { background: var(--panel); }
  .frame { color: #485444; }
  .frame-title { color: var(--accent-dim); }
  .key { color: var(--accent); }
  .cursor {
    color: var(--bg);
    background: var(--accent);
    animation: blink 1.1s steps(1, end) infinite;
  }
  .selected { background: #172015; }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  @media (max-width: 680px) {
    :root { --fs: 8.5px; }
    .stage { padding: 6px; }
    .screen { max-width: calc(100vw - 12px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="screen" id="screen" role="application" aria-label="nulo terminal prototype, 100 columns by 30 rows"></div>
    <input class="capture" id="capture" type="text" maxlength="80" autocomplete="off"
           autocapitalize="off" spellcheck="false" aria-label="Terminal input">
  </main>

<script>
(() => {
  "use strict";

  const COLS = 100;
  const ROWS = 30;
  const HISTORY_TOP = 2;
  const HISTORY_ROWS = 24;

  const screenEl = document.getElementById("screen");
  const capture = document.getElementById("capture");

  const state = {

          { id: "gpt-5.1-mini", name: "GPT-5.1 mini", api: "", contextWindow: 400000, maxTokens: 128000, reasoning: true, input: "text+image" },

        ]
      }
    ],

    providerReturn: "main",
    confirmDelete: null,

    form: null,
    formField: 0,
    formError: "",
    formOriginalId: "",
    formProviderId: "",
    formReturn: "providers"
  };

  let grid = emptyGrid();

  const planSteps = [
    "Audit existing layout",
    "Rebuild history + composer",
    "Verify approval flow",
    "Test at 80 / 100 / 120 cols"
  ];

  const paletteCommands = [
    { id: "review",    label: "Review patch",         hint: "Ctrl+R" },
    { id: "plan",      label: "Open plan",            hint: "Tab" },
    { id: "settings",  label: "Settings",             hint: "Ctrl+," },
    { id: "providers", label: "Manage providers + models", hint: "/providers" },
    { id: "help",      label: "Keyboard shortcuts",   hint: "F1" },
    { id: "clear",     label: "Clear transcript",     hint: "Ctrl+L" }
  ];

  const slashCommands = [
    { id: "plan",      name: "/plan",      desc: "open the plan view" },
    { id: "review",    name: "/review",    desc: "review the pending patch" },
    { id: "settings",  name: "/settings",  desc: "general settings" },
    { id: "providers", name: "/providers", desc: "providers + their models" },
    { id: "help",      name: "/help",      desc: "keyboard shortcuts" },
    { id: "clear",     name: "/clear",     desc: "clear the transcript" }
  ];

  const STORAGE_KEY = "nulo-design-state-v2";

  const providerFields = [
    { key: "id",         label: "ID" },
    { key: "name",       label: "Name" },
    { key: "baseUrl",    label: "Base URL" },
    { key: "api",        label: "API" },
    { key: "apiKey",     label: "API key" },
    { key: "authHeader", label: "Auth header" }
  ];

  const modelFields = [
    { key: "id",            label: "Model ID" },
    { key: "name",          label: "Name" },
    { key: "api",           label: "API override" },
    { key: "baseUrl",       label: "URL override" },
    { key: "contextWindow", label: "Context window" },
    { key: "maxTokens",     label: "Max output" },
    { key: "reasoning",     label: "Reasoning" },
    { key: "input",         label: "Input" }
  ];

  const toggleFormFields = new Set(["authHeader", "reasoning", "input"]);

  const settingsRows = [
    { key: "mode",      label: "Mode",             row: 3,  desc: "build or plan" },
    { key: "provider",  label: "Default provider", row: 4,  desc: "provider for new sessions" },
    { key: "model",     label: "Default model",    row: 5,  desc: "models in that provider" },
    { key: "thinking",  label: "Thinking level",   row: 6,  desc: "reasoning effort" },
    { key: "approvals", label: "Approvals",        row: 7,  desc: "review before apply" },
    { key: "context",   label: "Context warning",  row: 8,  desc: "warn before compaction" },
    { key: "providers", label: "Manage",           row: 11, desc: "providers and their models" },
    { key: "session",   label: "Session directory", row: 14, desc: "read-only in this prototype" }
  ];

  const helpRows = [
    ["/",      "slash commands"],
    ["Ctrl+P", "command palette"],
    ["Ctrl+,", "settings"],
    ["Tab",    "open plan"],
    ["Ctrl+R", "review patch"],
    ["Ctrl+L", "clear transcript"],
    ["F1",     "this help"],
    ["Enter",  "send message / run command"],
    ["Esc",    "close view / clear input"],
    ["SETTINGS", ""],
    ["j / k",  "move"],
    ["Enter",  "change value"],
    ["p",      "manage providers"],
    ["PROVIDERS", ""],
    ["enter",  "open provider models"],
    ["a / e",  "add / edit provider"],
    ["d",      "delete provider"],
    ["MODELS", ""],
    ["a / e",  "add / edit model"],
    ["d",      "delete model"],
    ["REVIEW", ""],
    ["j / k",  "scroll diff"],
    ["a / d",  "approve / reject patch"]
  ];

  const diffLines = [
    { type: "ctx", old: 12, new: 12, text: '<div class="app">' },
    { type: "rem", old: 13, text: '  <header class="topbar">' },
    { type: "add", new: 13, text: '  <header class="statusline">' },
    { type: "ctx", old: 14, new: 14, text: '    <span class="brand">nulo</span>' },
    { type: "rem", old: 15, text: '    <span class="meta">grok-4.6</span>' },
    { type: "add", new: 15, text: '    <span class="meta">build · main</span>' },
    { type: "ctx", old: 16, new: 16, text: '  </header>' },
    { type: "ctx", old: 17, new: 17, text: '' },
    { type: "rem", old: 18, text: '  <aside class="rail">' },
    { type: "add", new: 18, text: '  <section class="transcript">' },
    { type: "rem", old: 19, text: '    <div class="plan">2 / 4</div>' },
    { type: "rem", old: 20, text: '    <div class="changed">1 file</div>' },
    { type: "rem", old: 21, text: '    <div class="approvals">1 patch</div>' },
    { type: "add", new: 19, text: '    <div class="scrollback">…</div>' },
    { type: "rem", old: 22, text: '  </aside>' },
    { type: "add", new: 20, text: '  </section>' },
    { type: "ctx", old: 23, new: 21, text: '' },
    { type: "rem", old: 24, text: '  <div class="composer-zone">' },
    { type: "add", new: 22, text: '  <footer class="composer">' },
    { type: "ctx", old: 25, new: 23, text: '    <span class="sigil">❯</span>' },
    { type: "add", new: 24, text: '    <input aria-label="Message">' },
    { type: "ctx", old: 26, new: 25, text: '    <div class="hints">Ctrl+P commands</div>' },
    { type: "rem", old: 27, text: '  </div>' },
    { type: "add", new: 26, text: '  </footer>' },
    { type: "ctx", old: 28, new: 27, text: '</div>' }
  ];

  // ── cell grid ─────────────────────────────────────────────────────────

  function emptyGrid() {
    return Array.from({ length: ROWS }, () =>
      Array.from({ length: COLS }, () => ({ ch: " ", cls: "" }))
    );
  }

  function charWidth(ch) {
    const cp = ch.codePointAt(0);
    if (
      (cp >= 0x1100 && cp <= 0x115f) ||
      (cp >= 0x2e80 && cp <= 0xa4cf) ||
      (cp >= 0xac00 && cp <= 0xd7a3) ||
      (cp >= 0xf900 && cp <= 0xfaff) ||
      (cp >= 0xfe10 && cp <= 0xfe19) ||
      (cp >= 0xfe30 && cp <= 0xfe6f) ||
      (cp >= 0xff00 && cp <= 0xff60) ||
      (cp >= 0xffe0 && cp <= 0xffe6) ||
      (cp >= 0x1f300 && cp <= 0x1faff)
    ) return 2;
    return 1;
  }

  function widthOf(text) {
    let n = 0;
    for (const ch of String(text)) n += charWidth(ch);
    return n;
  }

  function put(row, col, text, cls = "") {
    if (row < 0 || row >= ROWS || col >= COLS) return col;
    let c = col;
    for (const ch of String(text)) {
      if (ch === "\n") break;
      const w = charWidth(ch);
      if (c < 0) { c += w; continue; }
      if (c >= COLS) break;
      grid[row][c] = { ch, cls };
      if (w === 2 && c + 1 < COLS) grid[row][c + 1] = { ch: "", cls };
      c += w;
    }
    return c;
  }

  function putRight(row, text, cls = "", pad = 0) {
    const start = Math.max(0, COLS - pad - widthOf(text));
    put(row, start, text, cls);
  }

  function putEnd(row, end, text, cls = "") {
    put(row, Math.max(0, end - widthOf(text)), text, cls);
  }

  function putSegs(row, segs, start = 0) {
    let c = start;
    for (const seg of segs) c = put(row, c, seg.text, seg.cls || "");
    return c;
  }

  function putSegsRight(row, segs, pad = 0) {
    let width = 0;
    for (const seg of segs) width += widthOf(seg.text);
    putSegs(row, segs, Math.max(0, COLS - pad - width));
  }

  function fillRow(row, ch = " ", cls = "") {
    for (let c = 0; c < COLS; c++) grid[row][c] = { ch, cls };
  }

  function fillRect(row, col, h, w, ch = " ", cls = "") {
    for (let r = row; r < row + h; r++) {
      if (r < 0 || r >= ROWS) continue;
      for (let c = col; c < col + w; c++) {
        if (c < 0 || c >= COLS) continue;
        grid[r][c] = { ch, cls };
      }
    }
  }

  function rule(row) {
    put(row, 0, "─".repeat(COLS), "rule");
  }

  function box(row, col, h, w, title = "") {
    fillRect(row, col, h, w, " ", "panel");
    put(row, col, "┌" + "─".repeat(Math.max(0, w - 2)) + "┐", "frame");
    put(row + h - 1, col, "└" + "─".repeat(Math.max(0, w - 2)) + "┘", "frame");
    for (let r = row + 1; r < row + h - 1; r++) {
      put(r, col, "│", "frame");
      put(r, col + w - 1, "│", "frame");
    }
    if (title) {
      put(row, col + 2, " " + title + " ", "frame-title");
    }
  }

  function panelPut(row, col, text, cls = "") {
    return put(row, col, text, cls ? "panel " + cls : "panel");
  }

  function panelPutRight(row, text, cls = "", pad = 0, edge = COLS) {
    const start = Math.max(0, edge - pad - widthOf(text));
    return panelPut(row, start, text, cls);
  }

  function panelSegs(row, segs, start = 0) {
    let c = start;
    for (const seg of segs) {
      c = panelPut(row, c, seg.text, seg.cls || "");
    }
    return c;
  }

  function panelSegsRight(row, segs, pad = 0) {
    let width = 0;
    for (const seg of segs) width += widthOf(seg.text);
    panelSegs(row, segs, Math.max(0, COLS - pad - width));
  }

  function underlayAll() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        grid[r][c] = { ch: grid[r][c].ch, cls: "underlay" };
      }
    }
  }

  function render() {
    grid = emptyGrid();
    if (state.view === "main") {
      drawMain();
      if (state.slashOpen) drawSlashMenu();
    }
    else if (state.view === "review") drawReview();
    else if (state.view === "plan") drawPlan();
    else if (state.view === "help") drawHelp();
    else if (state.view === "palette") drawPalette();
    else if (state.view === "settings") drawSettings();
    else if (state.view === "providers") drawProviders();
    else if (state.view === "provider-detail") drawProviderDetail();
    else if (state.view === "provider-form") drawProviderForm();
    else if (state.view === "model-form") drawModelForm();

    let html = "";
    for (let r = 0; r < ROWS; r++) {
      html += '<div class="row">';
      let cls = null;
      let text = "";
      for (let c = 0; c < COLS; c++) {
        const cell = grid[r][c];
        if (cell.ch === "") continue;
        if (cell.cls !== cls) {
          if (text) html += span(text, cls);
          cls = cell.cls;
          text = "";
        }
        text += cell.ch;
      }
      if (text) html += span(text, cls);
      html += "</div>";
    }
    screenEl.innerHTML = html;
  }

  function span(text, cls) {
    const safe = escapeHtml(text);
    return cls ? `<span class="${cls}">${safe}</span>` : safe;
  }

  function escapeHtml(text) {
    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }

  // ── shared chrome ─────────────────────────────────────────────────────

  function drawHeader(section, right) {
    putSegs(0, [
      { text: "nulo", cls: "accent bold" },
      { text: " / ", cls: "faint" },
      { text: section, cls: "soft" }
    ]);
    putSegsRight(0, right, 1);
  }

  function drawStatus(row, showPlan = true) {
    let left;
    if (state.patch === "applied") {
      left = [
        { text: "✓ applied", cls: "accent" },
        { text: "  1 file changed", cls: "soft" }
      ];
      if (showPlan) left.push({ text: "  plan 3/4", cls: "faint" });
    } else if (state.patch === "rejected") {
      left = [
        { text: "✕ rejected", cls: "bad" },
        { text: "  0 files changed", cls: "soft" }
      ];
      if (showPlan) left.push({ text: "  plan 2/4", cls: "faint" });
    } else {
      left = [
        { text: "● awaiting approval", cls: "accent" },
        { text: "  1 patch", cls: "soft" }
      ];
      if (showPlan) left.push({ text: "  plan 2/4", cls: "faint" });
    }
    putSegs(row, left);
    putSegsRight(row, [
      { text: "ctx 41.8k / 128k", cls: "faint" },
      { text: " · 33%", cls: "dim" }
    ], 1);
  }

  function drawKeyHints(row, hints, right = "100×30") {
    putSegs(row, hints);
    putRight(row, right, "faint", 1);
  }

  function drawPrompt(row) {
    put(row, 0, "❯", "accent");
    const value = state.input.replace(/[\r\n]/g, " ");
    const shown = value;
    const c = put(row, 2, shown, "ink");
    put(row, Math.min(COLS - 2, c), "█", "cursor");
  }

  // ── main ──────────────────────────────────────────────────────────────

  function drawMain() {
    drawHeader("settings-shortcuts", [
      { text: state.settings.mode, cls: "dim" },
      { text: " · " + defaultModelSpec(), cls: "faint" },
      { text: " · main", cls: "faint" }
    ]);
    rule(1);

    const visible = state.history.slice(-HISTORY_ROWS);
    visible.forEach((item, i) => drawHistoryItem(HISTORY_TOP + i, item));

    rule(26);
    drawStatus(27);

    if (state.notice) {
      put(28, 0, state.notice, "warn");
    } else {
      drawPrompt(28);
    }

    const hints = state.slashOpen
      ? [
          { text: "↑↓", cls: "key" }, { text: " move   ", cls: "faint" },
          { text: "enter", cls: "key" }, { text: " run   ", cls: "faint" },
          { text: "tab", cls: "key" }, { text: " complete   ", cls: "faint" },
          { text: "esc", cls: "key" }, { text: " close", cls: "faint" }
        ]
      : state.input
      ? [
          { text: "enter", cls: "key" }, { text: " send   ", cls: "faint" },
          { text: "esc", cls: "key" }, { text: " clear   ", cls: "faint" },
          { text: "/", cls: "key" }, { text: " commands", cls: "faint" }
        ]
      : [
          { text: "/", cls: "key" }, { text: " commands   ", cls: "faint" },
          { text: "Tab", cls: "key" }, { text: " plan   ", cls: "faint" },
          { text: "Ctrl+R", cls: state.patch === "proposed" ? "key" : "faint" },
          { text: " review   ", cls: "faint" },
          { text: "F1", cls: "key" }, { text: " help", cls: "faint" }
        ];
    drawKeyHints(29, hints);
  }

  function drawHistoryItem(row, item) {
    if (!item || item.type === "blank") return;

    if (item.type === "tool") {
      put(row, 2, item.kind, "kind");
      const statusCls = item.status === "fail" ? "bad" : item.status === "review" ? "warn" : "accent";
      put(row, 9, truncate(item.cmd, 71), "soft");
      put(row, 84, item.status, statusCls);
      putRight(row, item.time, "faint", 1);
      return;
    }

    if (item.type === "patch") {
      put(row, 2, "PATCH", "kind");
      put(row, 9, item.file, "soft");
      putSegsRight(row, [
        { text: "+" + item.add, cls: "add" },
        { text: "  ", cls: "" },
        { text: "−" + item.del, cls: "del" }
      ], 1);
      return;
    }

    putSegs(row, item.segs || []);
  }

  // ── review ────────────────────────────────────────────────────────────

  function drawReview() {
    const applied = state.patch === "applied";
    const rejected = state.patch === "rejected";
    drawHeader("review", [
      { text: "ui/design/index.html", cls: "soft" },
      { text: " · ", cls: "faint" },
      { text: applied ? "applied" : rejected ? "rejected" : "proposed", cls: applied ? "accent" : rejected ? "bad" : "warn" }
    ]);
    rule(1);

    put(2, 0, "  @@ -12,9 +12,12 @@", "hunk");
    putRight(2, "21 / " + diffLines.length + " lines", "faint", 1);

    const viewport = 21;
    const maxScroll = Math.max(0, diffLines.length - viewport);
    state.reviewScroll = Math.max(0, Math.min(state.reviewScroll, maxScroll));
    const visible = diffLines.slice(state.reviewScroll, state.reviewScroll + viewport);
    visible.forEach((line, i) => drawDiffLine(3 + i, line));

    const below = diffLines.length - (state.reviewScroll + visible.length);
    if (below > 0) {
      put(24, 2, `↓ ${below} more lines · j/k scroll`, "faint");
    } else if (state.reviewScroll > 0) {
      put(24, 2, `↑ ${state.reviewScroll} earlier lines`, "faint");
    }

    if (state.notice) put(25, 2, state.notice, "warn");

    if (state.patch === "proposed") {
      putSegs(26, [
        { text: "a", cls: "key" }, { text: " approve   ", cls: "faint" },
        { text: "d", cls: "key" }, { text: " reject   ", cls: "faint" },
        { text: "esc", cls: "key" }, { text: " back", cls: "faint" }
      ]);
    } else {
      putSegs(26, [
        { text: applied ? "✓ patch applied" : "✕ patch rejected", cls: applied ? "accent" : "bad" },
        { text: "   esc", cls: "faint" }, { text: " back", cls: "faint" }
      ]);
    }

    rule(27);
    drawStatus(28);
    drawKeyHints(29, [
      { text: "review", cls: "kind" },
      { text: " · ", cls: "faint" },
      { text: state.patch === "proposed" ? "patch not applied" : "patch " + state.patch, cls: "faint" }
    ]);
  }

  function drawDiffLine(row, line) {
    const oldNo = line.old ? String(line.old).padStart(4) : "    ";
    const newNo = line.new ? String(line.new).padStart(4) : "    ";
    const sign = line.type === "add" ? "+" : line.type === "rem" ? "-" : " ";
    const cls = line.type === "add" ? "add" : line.type === "rem" ? "rem" : "ctx";
    put(row, 0, oldNo, "ln");
    put(row, 4, "│", "rule");
    put(row, 5, newNo, "ln");
    put(row, 9, "│", "rule");
    put(row, 11, sign, cls);
    put(row, 13, truncate(line.text, COLS - 13), cls);
  }

  // ── command palette ───────────────────────────────────────────────────

  function drawPalette() {
    drawMain();
    underlayAll();

    const x = 15;
    const y = 8;
    const w = 70;
    const h = 13;
    box(y, x, h, w, "COMMANDS");

    const inner = x + 2;
    const innerRight = x + w - 2;

    panelPut(y + 1, inner, "❯", "accent");
    const queryStart = inner + 2;
    const query = state.paletteQuery;
    panelPut(y + 1, queryStart, query, "ink");
    panelPut(y + 1, queryStart + widthOf(query), "█", "cursor");
    const filtered = filteredCommands();
    panelPutRight(y + 1, filtered.length + " commands", "faint", 1, x + w - 2);

    fillRect(y + 2, x + 1, 1, w - 2, "─", "panel rule");

    const listTop = y + 3;
    if (filtered.length === 0) {
      panelPut(listTop, inner, "No command matches “" + query + "”.", "faint");
    } else {
      filtered.forEach((cmd, i) => {
        const r = listTop + i;
        if (r >= y + h - 2) return;
        const selected = i === state.paletteIndex;
        const sel = selected ? " selected" : "";
        if (selected) fillRect(r, x + 1, 1, w - 2, " ", "panel selected");
        panelPut(r, inner, selected ? "▸" : " ", selected ? "accent" + sel : "faint");
        panelPut(r, inner + 2, cmd.label, (selected ? "accent" : "soft") + sel);
        panelPutRight(r, cmd.hint, (selected ? "accent-dim" : "faint") + sel, 2, x + w - 2);
      });
    }

    panelPut(y + h - 2, inner, "↑↓ move   enter run   esc close", "faint");
    panelPutRight(y + h - 2, "100×30", "faint", 2, x + w - 2);
  }

  function filteredCommands() {
    const q = state.paletteQuery.trim().toLowerCase();
    if (!q) return paletteCommands;
    return paletteCommands.filter((cmd) =>
      (cmd.label + " " + cmd.hint).toLowerCase().includes(q)
    );
  }

  function slashQuery() {
    return state.input.slice(1).split(/\s+/)[0].toLowerCase();
  }

  function filteredSlash() {
    const q = slashQuery();
    if (!q) return slashCommands;
    return slashCommands.filter((cmd) =>
      cmd.name.slice(1).startsWith(q) || cmd.desc.toLowerCase().includes(q)
    );
  }

  function syncSlash() {
    state.slashOpen = state.input.startsWith("/") && !/\s/.test(state.input);
    const n = filteredSlash().length;
    if (state.slashIndex >= n) state.slashIndex = Math.max(0, n - 1);
    if (!state.slashOpen) state.slashIndex = 0;
  }

  function drawSlashMenu() {
    const x = 2;
    const y = 16;
    const w = 64;
    const h = 10;
    box(y, x, h, w, "SLASH");
    const inner = x + 2;
    const q = "/" + slashQuery();
    panelPut(y + 1, inner, "❯", "accent");
    panelPut(y + 1, inner + 2, q, "ink");
    panelPut(y + 1, inner + 2 + widthOf(q), "█", "cursor");
    const filtered = filteredSlash();
    panelPutRight(y + 1, filtered.length + " commands", "faint", 1, x + w - 2);
    fillRect(y + 2, x + 1, 1, w - 2, "─", "panel rule");

    const listTop = y + 3;
    if (!filtered.length) {
      panelPut(listTop, inner, "No command matches " + q, "faint");
    } else {
      filtered.forEach((cmd, i) => {
        const r = listTop + i;
        if (r >= y + h) return;
        const selected = i === state.slashIndex;
        const sel = selected ? " selected" : "";
        if (selected) fillRect(r, x + 1, 1, w - 2, " ", "panel selected");
        panelPut(r, inner, selected ? "▸" : " ", selected ? "accent" + sel : "faint");
        panelPut(r, inner + 2, cmd.name, (selected ? "accent" : "soft") + sel);
        panelPut(r, inner + 15, truncate(cmd.desc, 40), (selected ? "accent-dim" : "faint") + sel);
      });
    }
  }

  function executeSlashCommand() {
    const filtered = filteredSlash();
    const cmd = filtered[state.slashIndex];
    if (!cmd) return;
    state.input = "";
    capture.value = "";
    state.slashOpen = false;
    state.slashIndex = 0;
    state.notice = "";
    if (cmd.id === "plan") openPlan();
    else if (cmd.id === "review") openReview();
    else if (cmd.id === "settings") openSettings();
    else if (cmd.id === "providers") openProviders("main");
    else if (cmd.id === "help") openHelp();
    else if (cmd.id === "clear") clearTranscript();
  }

  function completeSlash() {
    const filtered = filteredSlash();
    const cmd = filtered[state.slashIndex];
    if (!cmd) return;
    state.input = cmd.name + " ";
    capture.value = state.input;
    state.slashOpen = false;
    render();
    focusInput();
  }

  // ── settings ──────────────────────────────────────────────────────────

  function providerModels(provider) {
    return provider && Array.isArray(provider.models) ? provider.models : [];
  }

  function providerById(id) {
    return state.providers.find((p) => p.id === id) || null;
  }

  function detailProvider() {
    return providerById(state.detailProviderId) || state.providers[0] || null;
  }

  function defaultProvider() {
    return providerById(state.settings.defaultProvider) || state.providers[0] || null;
  }

  function defaultModelEntry(provider = defaultProvider()) {
    if (!provider) return null;
    const models = providerModels(provider);
    return models.find((m) => m.id === state.settings.defaultModel) || models[0] || null;
  }

  function defaultModelSpec() {
    const provider = defaultProvider();
    const model = defaultModelEntry(provider);
    if (!provider) return "no provider";
    return provider.id + "/" + (model ? model.id : "no-model");
  }

  function ensureDefaultSelection() {
    let provider = providerById(state.settings.defaultProvider);
    if (!provider && state.providers.length) {
      provider = state.providers[0];
      state.settings.defaultProvider = provider.id;
    }
    if (!provider) {
      state.settings.defaultProvider = "";
      state.settings.defaultModel = "";
      return;
    }
    const models = providerModels(provider);
    if (!models.some((m) => m.id === state.settings.defaultModel)) {
      state.settings.defaultModel = models[0] ? models[0].id : "";
    }
  }

  function modelCountLabel(models) {
    return models.length + (models.length === 1 ? " model" : " models");
  }

  function totalModelCount() {
    return state.providers.reduce((sum, provider) => sum + providerModels(provider).length, 0);
  }

  function formatTokens(n) {
    const value = Number(n) || 0;
    if (value >= 1000000) return (value / 1000000).toFixed(value % 1000000 ? 1 : 0) + "M";
    if (value >= 1000) return Math.round(value / 1000) + "k";
    return String(value);
  }

  function modelCaps(model) {
    const caps = [];
    if (model.reasoning) caps.push("reason");
    if (model.input === "text+image") caps.push("image");
    return caps.length ? caps.join(" · ") : "text";
  }

  function modelInputLabel(model) {
    return model.input === "text+image" ? "text + image" : "text";
  }

  function providerName(provider) {
    return provider.name || provider.id;
  }

  function settingsValue(key) {
    if (key === "mode") return state.settings.mode;
    if (key === "provider") return state.settings.defaultProvider || "none";
    if (key === "model") return state.settings.defaultModel || "none";
    if (key === "thinking") return state.settings.thinking || "off";
    if (key === "approvals") return state.settings.approvals;
    if (key === "context") return state.settings.contextWarn + "%";
    if (key === "providers") return state.providers.length + " providers · " + totalModelCount() + " models";
    if (key === "session") return "~/.nulo/sessions";
    return "";
  }

  function settingsDesc(key) {
    if (key === "model") {
      const provider = defaultProvider();
      if (!provider) return "no provider configured";
      return providerModels(provider).length + " models in " + provider.id;
    }
    const row = settingsRows.find((item) => item.key === key);
    return row ? row.desc : "";
  }

  function drawFormValue(row, field, form, selected) {
    const toggle = toggleFormFields.has(field.key);
    let value = "";
    if (field.key === "authHeader" || field.key === "reasoning") {
      value = form[field.key] ? "yes" : "no";
    } else if (field.key === "input") {
      value = form.input === "text+image" ? "text + image" : "text";
    } else {
      value = String(form[field.key] || "");
    }
    put(row, 2, selected ? ">" : " ", selected ? "accent" : "faint");
    put(row, 4, truncate(field.label, 15), selected ? "accent" : "soft");
    put(row, 20, "[", "faint");
    if (!value && (field.key === "api" || field.key === "baseUrl") && selected) {
      const placeholder = field.key === "api" ? "inherit provider" : "inherit provider URL";
      put(row, 21, truncate(placeholder, 66), "faint");
    } else if (!value && field.key === "apiKey") {
      put(row, 21, "none", "faint");
    } else {
      put(row, 21, truncate(value, 66), selected ? "ink" : "muted");
    }
    put(row, 88, "]", "faint");
    if (selected && !toggle && !value) put(row, 21, "█", "cursor");
    else if (selected && !toggle) put(row, Math.min(87, 21 + widthOf(truncate(value, 66))), "█", "cursor");
  }

  function activeFormFields() {
    return state.view === "model-form" ? modelFields : providerFields;

  function focusFormField() {
    const fields = activeFormFields();
    const field = fields[state.formField];
    if (!field || !state.form) return;
    if (toggleFormFields.has(field.key)) {
      capture.value = "";
      capture.blur();
      return;
    }
    capture.value = String(state.form[field.key] || "");
    capture.focus({ preventScroll: true });
    capture.select();
  }

  function moveFormField(delta) {
    const fields = activeFormFields();
    state.formField = (state.formField + delta + fields.length) % fields.length;
    state.formError = "";
    focusFormField();
    render();

  function cancelForm() {
    const returnTo = state.formReturn;
    state.form = null;
    state.formError = "";
    state.input = "";
    state.slashOpen = false;
    capture.value = "";
    state.view = returnTo;
    if (returnTo === "provider-detail") {
      state.detailProviderId = state.formProviderId || state.detailProviderId;
    }
    capture.blur();

  function saveProviderForm() {
    const form = state.form;
    if (!form) return;
    const id = String(form.id || "").trim();
    const baseUrl = String(form.baseUrl || "").trim();
    const api = String(form.api || "").trim();
    if (!id || !baseUrl || !api) {
      state.formError = "id, base URL and api are required.";
      render();
      return;
    }
    if (state.providers.some((p) => p.id === id && p.id !== state.formOriginalId)) {
      state.formError = "Provider id already exists.";
      render();
      return;
    }
    const existing = providerById(state.formOriginalId);
    const isNew = !existing;
    const record = {
      id,
      name: String(form.name || "").trim() || id,
      baseUrl,
      api,
      apiKey: String(form.apiKey || "").trim() || "none",
      authHeader: !!form.authHeader,
      models: existing ? providerModels(existing) : []
    };
    if (existing) {
      const index = state.providers.indexOf(existing);
      state.providers[index] = record;
      state.providerIndex = index;
      if (state.settings.defaultProvider === state.formOriginalId) {
        state.settings.defaultProvider = id;
      }
    } else {
      state.providers.push(record);
      state.providerIndex = state.providers.length - 1;
    }
    state.detailProviderId = id;
    ensureDefaultSelection();
    state.form = null;
    state.formError = "";
    state.input = "";
    state.slashOpen = false;
    capture.value = "";
    state.view = state.formReturn === "provider-detail" || isNew ? "provider-detail" : "providers";
    state.confirmDelete = null;
    savePersistedState();
    render();
  }

  function saveModelForm() {
    const form = state.form;
    const provider = providerById(state.formProviderId);
    if (!form || !provider) return;
    const id = String(form.id || "").trim();
    const contextWindow = Number(String(form.contextWindow || "").trim());
    const maxTokens = Number(String(form.maxTokens || "").trim());
    if (!id) {
      state.formError = "Model id is required.";
      render();
      return;
    }
    if (!Number.isFinite(contextWindow) || contextWindow <= 0 || !Number.isFinite(maxTokens) || maxTokens <= 0) {
      state.formError = "Context window and max output must be positive numbers.";
      render();
      return;
    }
    if (providerModels(provider).some((m) => m.id === id && m.id !== state.formOriginalId)) {
      state.formError = "Model id already exists in this provider.";
      render();
      return;
    }
    const record = {
      id,
      name: String(form.name || "").trim() || id,
      api: String(form.api || "").trim(),
      baseUrl: String(form.baseUrl || "").trim(),
      contextWindow,
      maxTokens,
      reasoning: !!form.reasoning,
      input: form.input === "text+image" ? "text+image" : "text"
    };
    const models = providerModels(provider);
    const existingIndex = models.findIndex((m) => m.id === state.formOriginalId);
    if (existingIndex >= 0) {
      models[existingIndex] = record;
      state.modelIndex = existingIndex;
    } else {
      models.push(record);
      state.modelIndex = models.length - 1;
    }
    if (state.settings.defaultProvider === provider.id && state.settings.defaultModel === state.formOriginalId) {
      state.settings.defaultModel = id;
    }
    ensureDefaultSelection();
    state.form = null;
    state.formError = "";
    state.input = "";
    state.slashOpen = false;
    capture.value = "";
    state.view = "provider-detail";
    state.detailProviderId = provider.id;
    state.confirmDelete = null;
    savePersistedState();
    render();
  }

  function saveCurrentForm() {
    if (state.view === "model-form") saveModelForm();
    else saveProviderForm();
  }

  function deleteProvider() {
    if (!state.confirmDelete || state.confirmDelete.type !== "provider") return;
    const id = state.confirmDelete.providerId;
    const index = state.providers.findIndex((p) => p.id === id);
    if (index >= 0) state.providers.splice(index, 1);
    state.providerIndex = Math.max(0, Math.min(state.providerIndex, Math.max(0, state.providers.length - 1)));
    state.confirmDelete = null;
    if (state.settings.defaultProvider === id) {
      state.settings.defaultProvider = state.providers[0] ? state.providers[0].id : "";
      state.settings.defaultModel = "";
    }
    ensureDefaultSelection();
    savePersistedState();
    render();
  }

  function deleteModel() {
    if (!state.confirmDelete || state.confirmDelete.type !== "model") return;
    const provider = detailProvider();
    if (!provider) return;
    const models = providerModels(provider);
    const id = state.confirmDelete.modelId;
    const index = models.findIndex((m) => m.id === id);
    if (index >= 0) models.splice(index, 1);
    state.modelIndex = Math.max(0, Math.min(state.modelIndex, Math.max(0, models.length - 1)));
    if (state.settings.defaultProvider === provider.id && state.settings.defaultModel === id) {
      state.settings.defaultModel = models[0] ? models[0].id : "";
    }
    ensureDefaultSelection();
    state.confirmDelete = null;
    savePersistedState();
    render();
  }

  // ── keyboard ──────────────────────────────────────────────────────────

  function applySetting() {
    const item = settingsRows[state.settingsIndex];
    if (!item) return;
    state.settingsNotice = "";

    if (item.key === "mode") {
      state.settings.mode = state.settings.mode === "build" ? "plan" : "build";
    } else if (item.key === "provider") {
      if (!state.providers.length) {
        state.settingsNotice = "No providers configured.";
      } else {
        const index = state.providers.findIndex((p) => p.id === state.settings.defaultProvider);
        const next = state.providers[(index + 1 + state.providers.length) % state.providers.length];
        state.settings.defaultProvider = next.id;
        if (!providerModels(next).some((m) => m.id === state.settings.defaultModel)) {
          state.settings.defaultModel = providerModels(next)[0] ? providerModels(next)[0].id : "";
        }
      }
    } else if (item.key === "model") {
      const provider = defaultProvider();
      const models = providerModels(provider);
      if (!provider || !models.length) {
        state.settingsNotice = "This provider has no models.";
      } else {
        const index = models.findIndex((m) => m.id === state.settings.defaultModel);
        state.settings.defaultModel = models[(index + 1) % models.length].id;
      }
    } else if (item.key === "thinking") {
      const values = ["off", "low", "medium", "high"];
      const index = values.indexOf(state.settings.thinking);
      state.settings.thinking = values[(index + 1) % values.length];
    } else if (item.key === "approvals") {
      state.settings.approvals = state.settings.approvals === "manual" ? "auto" : "manual";
    } else if (item.key === "context") {
      const values = [70, 80, 90];
      const index = values.indexOf(state.settings.contextWarn);
      state.settings.contextWarn = values[(index + 1) % values.length];
    } else if (item.key === "providers") {
      openProviders("settings");
      return;
    } else if (item.key === "session") {
      state.settingsNotice = "Session directory is fixed in this prototype.";
    }
    ensureDefaultSelection();
    savePersistedState();
    render();
  }

  function submit() {
    const text = state.input.trim();
    if (!text) return;
    state.slashOpen = false;

    if (text === "/plan") {
      state.input = "";
      capture.value = "";
      openPlan();
      return;
    }
    if (text === "/review" || text === "/approve" || text === "/reject") {
      state.input = "";
      capture.value = "";
      openReview();
      return;
    }
    if (text === "/help") {
      state.input = "";
      capture.value = "";
      openHelp();
      return;
    }
    if (text === "/settings") {
      state.input = "";
      capture.value = "";
      openSettings();
      return;
    }
    if (text === "/providers") {
      state.input = "";
      capture.value = "";
      openProviders("main");
      return;
    }
    if (text === "/clear") {
      state.input = "";
      capture.value = "";
      clearTranscript();
      return;
    }

    appendUser(text);
    state.input = "";
    capture.value = "";

    if (state.patch === "proposed") {
      appendAgent("Keeping the patch in review. Press Ctrl+R to inspect the diff before approving.");
    } else if (state.patch === "applied") {
      appendAgent("The patch is already applied. Continue with the next change when ready.");
    } else {
      appendAgent("The last patch was rejected. Nothing was written to disk.");
    }
    state.notice = "";
    render();
    focusInput();
  }

  function approve() {
    if (state.patch !== "proposed") return;
    state.patch = "applied";
    state.planStep = 3;
    state.view = "main";
    state.notice = "";
    state.history.push({ type: "blank" });
    state.history.push({
      type: "line",
      segs: [seg("✓", "accent"), seg(" patch applied · ui/design/index.html", "soft")]
    });
    state.history.push({
      type: "line",
      segs: [seg("  1 file changed · +184 −96", "faint")]
    });
    render();
    focusInput();
  }

  function reject() {
    if (state.patch !== "proposed") return;
    state.patch = "rejected";
    state.view = "main";
    state.notice = "";
    state.history.push({ type: "blank" });
    state.history.push({
      type: "line",
      segs: [seg("✕", "bad"), seg(" patch rejected · ui/design/index.html", "soft")]
    });
    state.history.push({
      type: "line",
      segs: [seg("  No files changed.", "faint")]
    });
    render();
    focusInput();
  }

  function executePaletteCommand() {
    const filtered = filteredCommands();
    const cmd = filtered[state.paletteIndex];
    if (!cmd) return;

    if (cmd.id === "review") openReview();
    else if (cmd.id === "plan") openPlan();
    else if (cmd.id === "settings") openSettings();
    else if (cmd.id === "providers") openProviders("main");
    else if (cmd.id === "help") openHelp();
    else if (cmd.id === "clear") clearTranscript();
  }

  function focusInput() {
    if (state.view !== "main") return;
    capture.focus({ preventScroll: true });
  }

  function onDocumentKeydown(event) {
    const key = event.key;
    const lower = key.toLowerCase();

    if (state.view === "main") {
      if (state.slashOpen) {
        const n = filteredSlash().length;
        if (key === "ArrowDown" || key === "ArrowUp") {
          event.preventDefault();
          if (n) state.slashIndex = key === "ArrowDown"
            ? (state.slashIndex + 1) % n
            : (state.slashIndex - 1 + n) % n;
          render();
          return;
        }
        if (key === "Tab") {
          event.preventDefault();
          completeSlash();
          return;
        }
        if (key === "Enter") {
          event.preventDefault();
          executeSlashCommand();
          return;
        }
        if (key === "Escape") {
          event.preventDefault();
          state.input = "";
          capture.value = "";
          state.slashOpen = false;
          render();
          return;
        }
      }

      if (key === "Enter") {
        event.preventDefault();
        submit();
        return;
      }
      if (key === "Escape") {
        if (state.input) {
          event.preventDefault();
          state.input = "";
          capture.value = "";
          state.slashOpen = false;
          render();
        }
        return;
      }
      if (key === "Tab") {
        event.preventDefault();
        openPlan();
        return;
      }
      if (key === "F1") {
        event.preventDefault();
        openHelp();
        return;
      }
      if (event.ctrlKey && !event.altKey && !event.metaKey) {
        if (lower === "p") {
          event.preventDefault();
          openPalette();
        } else if (lower === "r") {
          event.preventDefault();
          openReview();
        } else if (lower === "l") {
          event.preventDefault();
          clearTranscript();
        } else if (key === "," || lower === ",") {
          event.preventDefault();
          openSettings();
        }
      }
      if (document.activeElement !== capture && key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        capture.focus({ preventScroll: true });
        state.input += key;
        capture.value = state.input;
        syncSlash();
        render();
      }
      return;
    }

    if (state.view === "palette") {
      event.preventDefault();
      if (key === "Escape") {
        closeView();
        return;
      }
      if (key === "ArrowDown" || key === "Tab") {
        const n = filteredCommands().length;
        if (n) state.paletteIndex = (state.paletteIndex + 1) % n;
        render();
        return;
      }
      if (key === "ArrowUp") {
        const n = filteredCommands().length;
        if (n) state.paletteIndex = (state.paletteIndex - 1 + n) % n;
        render();
        return;
      }
      if (key === "Enter") {
        executePaletteCommand();
        return;
      }
      if (key === "Backspace") {
        state.paletteQuery = state.paletteQuery.slice(0, -1);
        state.paletteIndex = 0;
        render();
        return;
      }
      if (key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        state.paletteQuery += key;
        state.paletteIndex = 0;
        render();
      }
      return;
    }

    if (state.view === "settings") {
      event.preventDefault();
      const n = settingsRows.length;
      if (key === "Escape") {
        closeView();
      } else if (key === "j" || key === "ArrowDown") {
        state.settingsIndex = (state.settingsIndex + 1) % n;
        state.settingsNotice = "";
        render();
      } else if (key === "k" || key === "ArrowUp") {
        state.settingsIndex = (state.settingsIndex - 1 + n) % n;
        state.settingsNotice = "";
        render();
      } else if (key === "Enter") {
        applySetting();
      } else if (lower === "p") {
        openProviders("settings");
      }
      return;
    }

    if (state.view === "providers") {
      event.preventDefault();
      if (state.confirmDelete && state.confirmDelete.type === "provider") {
        if (lower === "y") deleteProvider();
        else if (lower === "n" || key === "Escape") {
          state.confirmDelete = null;
          render();
        }
        return;
      }
      if (key === "Escape") {
        closeProviders();
      } else if (key === "j" || key === "ArrowDown") {
        if (state.providers.length) {
          state.providerIndex = (state.providerIndex + 1) % state.providers.length;
          render();
        }
      } else if (key === "k" || key === "ArrowUp") {
        if (state.providers.length) {
          state.providerIndex = (state.providerIndex - 1 + state.providers.length) % state.providers.length;
          render();
        }
      } else if (key === "Enter") {
        const provider = state.providers[state.providerIndex];
        if (provider) openProviderDetail(provider);
      } else if (lower === "a") {
        openProviderForm("new", null, "providers");
      } else if (lower === "e") {
        const provider = state.providers[state.providerIndex];
        if (provider) openProviderForm("edit", provider, "providers");
      } else if (lower === "d") {
        const provider = state.providers[state.providerIndex];
        if (provider) {
          state.confirmDelete = { type: "provider", providerId: provider.id };
          render();
        }
      }
      return;
    }

    if (state.view === "provider-detail") {
      event.preventDefault();
      const provider = detailProvider();
      const models = providerModels(provider);
      if (state.confirmDelete && state.confirmDelete.type === "model") {
        if (lower === "y") deleteModel();
        else if (lower === "n" || key === "Escape") {
          state.confirmDelete = null;
          render();
        }
        return;
      }
      if (key === "Escape") {
        state.view = "providers";
        state.confirmDelete = null;
        render();
      } else if (key === "j" || key === "ArrowDown") {
        if (models.length) {
          state.modelIndex = (state.modelIndex + 1) % models.length;
          render();
        }
      } else if (key === "k" || key === "ArrowUp") {
        if (models.length) {
          state.modelIndex = (state.modelIndex - 1 + models.length) % models.length;
          render();
        }
      } else if (key === "Enter" || lower === "e") {
        const model = models[state.modelIndex];
        if (model) openModelForm("edit", model);
      } else if (lower === "a") {
        openModelForm("new");
      } else if (lower === "d") {
        const model = models[state.modelIndex];
        if (model) {
          state.confirmDelete = { type: "model", providerId: provider.id, modelId: model.id };
          render();
        }
      } else if (lower === "p") {
        if (provider) openProviderForm("edit", provider, "provider-detail");
      }
      return;
    }

    if (state.view === "provider-form" || state.view === "model-form") {
      const fields = activeFormFields();
      const field = fields[state.formField];
      if (key === "Escape") {
        event.preventDefault();
        cancelForm();
        return;
      }
      if (key === "Tab") {
        event.preventDefault();
        moveFormField(event.shiftKey ? -1 : 1);
        return;
      }
      if (key === "ArrowDown" || key === "ArrowUp") {
        event.preventDefault();
        moveFormField(key === "ArrowDown" ? 1 : -1);
        return;
      }
      if (key === "Enter") {
        event.preventDefault();
        if (state.formField === fields.length - 1) saveCurrentForm();
        else moveFormField(1);
        return;
      }
      if (event.ctrlKey && lower === "s") {
        event.preventDefault();
        saveCurrentForm();
        return;
      }
      if (field && toggleFormFields.has(field.key) && (key === " " || key === "Spacebar")) {
        event.preventDefault();
        if (field.key === "input") {
          state.form.input = state.form.input === "text+image" ? "text" : "text+image";
        } else {
          state.form[field.key] = !state.form[field.key];
        }
        state.formError = "";
        render();
        return;
      }
      return;
    }

    if (state.view === "review") {
      event.preventDefault();
      if (key === "Escape") {
        closeView();
      } else if (lower === "a") {
        approve();
      } else if (lower === "d") {
        reject();
      } else if (lower === "j" || key === "ArrowDown") {
        state.reviewScroll = Math.min(
          Math.max(0, diffLines.length - 21),
          state.reviewScroll + 1
        );
        render();
      } else if (lower === "k" || key === "ArrowUp") {
        state.reviewScroll = Math.max(0, state.reviewScroll - 1);
        render();
      } else if (key === "PageDown") {
        state.reviewScroll = Math.min(
          Math.max(0, diffLines.length - 21),
          state.reviewScroll + 10
        );
        render();
      } else if (key === "PageUp") {
        state.reviewScroll = Math.max(0, state.reviewScroll - 10);
        render();
      }
      return;
    }

    if (state.view === "plan") {
      event.preventDefault();
      if (key === "Escape") closeView();
      else if (event.ctrlKey && lower === "r") openReview();
      return;
    }

    if (state.view === "help") {
      event.preventDefault();
      if (key === "Escape" || key === "F1") closeView();
      return;
    }
  }

  // ── helpers ───────────────────────────────────────────────────────────

  function truncate(text, width) {
    let out = "";
    let used = 0;
    for (const ch of String(text)) {
      const w = charWidth(ch);
      if (used + w > width) break;
      out += ch;
      used += w;
    }
    return out;
  }

  function wrapText(text, width) {
    const words = String(text).replace(/\s+/g, " ").trim().split(" ");
    const lines = [];
    let line = "";
    for (const word of words) {
      const candidate = line ? line + " " + word : word;
      if (widthOf(candidate) <= width) {
        line = candidate;
      } else {
        if (line) lines.push(line);
        line = "";
        let rest = word;
        while (widthOf(rest) > width) {
          let part = "";
          let used = 0;
          for (const ch of rest) {
            const w = charWidth(ch);
            if (used + w > width) break;
            part += ch;
            used += w;
          }
          lines.push(part);
          rest = rest.slice(part.length);
        }
        line = rest;
      }
    }
    if (line) lines.push(line);
    return lines.length ? lines : [""];
  }

  function clock() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  function loadPersistedState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data && data.settings && typeof data.settings === "object") {
        Object.assign(state.settings, data.settings);
      }
      if (data && Array.isArray(data.providers)) {
        state.providers = data.providers
          .filter((provider) => provider && provider.id)
          .map((provider) => ({
            id: String(provider.id),
            name: String(provider.name || provider.id),
            baseUrl: String(provider.baseUrl || ""),
            api: String(provider.api || "openai-completions"),
            apiKey: String(provider.apiKey || "none"),
            authHeader: !!provider.authHeader,
            models: (Array.isArray(provider.models) ? provider.models : [])
              .filter((model) => model && model.id)
              .map((model) => ({
                id: String(model.id),
                name: String(model.name || model.id),
                api: String(model.api || ""),
                baseUrl: String(model.baseUrl || ""),
                contextWindow: Number(model.contextWindow) || 128000,
                maxTokens: Number(model.maxTokens) || 16384,
                reasoning: !!model.reasoning,
                input: model.input === "text+image" ? "text+image" : "text"
              }))
          }));
      }
      ensureDefaultSelection();
    } catch {}
  }

  function savePersistedState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        settings: state.settings,
        providers: state.providers
      }));
    } catch {}
  }

  // ── boot ──────────────────────────────────────────────────────────────

  loadPersistedState();
  ensureDefaultSelection();
  seedHistory();

  capture.addEventListener("input", () => {
    if (state.view === "main") {
      state.input = capture.value;
      state.notice = "";
      syncSlash();
      render();
      return;
    }
    if ((state.view === "provider-form" || state.view === "model-form") && state.form) {
      const field = activeFormFields()[state.formField];
      if (field && !toggleFormFields.has(field.key)) {
        state.form[field.key] = capture.value;
        state.formError = "";
        render();
      }
    }
  });

  screenEl.addEventListener("click", () => {
    if (state.view === "main") focusInput();
    else if (state.view === "provider-form" || state.view === "model-form") focusFormField();
  });

  document.addEventListener("keydown", onDocumentKeydown);

  render();
  requestAnimationFrame(() => focusInput());
})();
</script>
</body>
